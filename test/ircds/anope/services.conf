/*
 * Anope 2.1 settings shared by both pairings (ngircd.conf, unrealircd.conf
 * define the uplink and protocol). The RPC endpoint is
 * http://anope:8080/jsonrpc with bearer token "fixture-rpc-token"
 * (rpc_user: anope.checkCredentials and friends; rpc_data; rpc_system).
 */
serverinfo
{
	name = "${services.host}"
	description = "Anope test fixture"
	motd = "services.motd"
}
networkinfo
{
	networkname = "${network.name}"
	nicklen = 30
	userlen = 10
	hostlen = 64
	chanlen = 32
	allow_undotted_vhosts = no
	disallow_start_or_end = ".-/"
}
options
{
	casemap = "ascii"
	badpasslimit = 50
	badpasstimeout = 1h
	updatetimeout = 30s
	expiretimeout = 30m
	readtimeout = 5s
	timeoutcheck = 3s
	retrywait = 5s
	hideprivilegedcommands = yes
	hideregisteredcommands = yes
	didyoumeandifference = 4
	codelength = 15
	linelength = 100
}
include { type = "file" name = "chanserv.example.conf" }
include { type = "file" name = "global.example.conf" }
include { type = "file" name = "nickserv.example.conf" }
include { type = "file" name = "operserv.example.conf" }

log { target = "services.log" admin = "*" commands = "*" servers = "*" users = "connect disconnect nick" other = "*" }
opertype { name = "Services Root" commands = "*" privs = "*" }
oper { name = "admin" type = "Services Root" require_oper = no password = "fixture-oper" }
mail { usemail = no }

module { name = "db_json" database = "anope.json" }
module { name = "enc_sha2" }
module { name = "help" }

module
{
	name = "httpd"
	httpd { name = "httpd/main" ip = "0.0.0.0" port = 8080 timeout = 30 }
}
module
{
	name = "jsonrpc"
	server = "httpd/main"
	token { token = "fixture-rpc-token" methods = "*" }
}
module { name = "rpc_user" }
module { name = "rpc_data" }
module { name = "rpc_system" }
