/* UnrealIRCd 6 test fixture: TLS on 6697 (self-signed), plaintext on 6667,
 * the default module set, an Anope link on 6900 (plaintext, the compose
 * network only). No webirc block and nothing Boson-specific: those are what
 * the setup wizard asks the admin to add (test/ircds/run.sh apply appends
 * them to extra.conf, included last). */
include "modules.default.conf";
include "help/help.conf";
include "operclass.default.conf";
include "snomasks.default.conf";
include "aliases/anope.conf";
loadmodule "cloak_sha256";

me { name "irc.unreal.test"; info "UnrealIRCd test fixture"; sid "001"; }
admin { "Boson setup probe fixture"; "admin@unreal.test"; }

class clients { pingfreq 90; maxclients 1000; sendq 200k; recvq 8000; }
class opers   { pingfreq 90; maxclients 50; sendq 1M; recvq 8000; }
class servers { pingfreq 60; connfreq 15; maxclients 10; sendq 20M; }

allow { mask *; class clients; maxperip 3; }

oper admin {
	class opers;
	mask *@*;
	password "fixture-oper";
	operclass netadmin;
}

listen { ip *; port 6667; }
listen {
	ip *; port 6697;
	options { tls; }
	tls-options { certificate "/certs/cert.pem"; key "/certs/key.pem"; }
}
listen { ip *; port 6900; options { serversonly; } }

link services.unreal.test {
	incoming { mask *; }
	password "fixture-link";
	class servers;
}
ulines { services.unreal.test; }

drpass { restart "fixture-restart"; die "fixture-die"; }

log {
	source { all; !debug; }
	destination { file "ircd.log" { maxsize 10M; } }
}

set {
	network-name "UnrealNet";
	default-server "irc.unreal.test";
	services-server "services.unreal.test";
	help-channel "#help";
	cloak-prefix "Clk";
	cloak-keys {
		/* Fixed test keys (UnrealIRCd wants 80+ characters each). */
		"nBs8RMqZz4I4CSbiUFphyD4wF9Ek6qS73IbXCEE67npxTXB7KOgAJPRnvtcMjsE3NoZLy5zFdYkZxHSsQJBwrAfWjz5Ay3Ek";
		"v4BgeLdWdXz5eP7EeZ0hoAEV2GVu83gq1Us9YeyuUpFZntDNS3ucwOeSFY1PaF838P97q4a8tQWS11n8d57dxAvdCZzuZDrD";
		"iwSQ2j6Wjh13VaFUEMBQwXxzN1jCqzPNYKRigD8khriMvX2sH9pI1DmRamirXZiPX6AclU9JvglvnG69APSqZkd56mCnw4bX";
	}
	tls { certificate "/certs/cert.pem"; key "/certs/key.pem"; }
	kline-address "admin@unreal.test";
	modes-on-connect "+ixw";
	modes-on-join "+nt";
	/* The probe, the smoke test and CI all connect from one address (the
	 * compose gateway); the default is 3 connections a minute. */
	anti-flood { everyone { connect-flood 60:60; } }
}
/* Anope links in plaintext over the compose network (UnrealIRCd only allows
 * that from localhost by default). */
set { plaintext-policy { server allow; } }
set {
	connthrottle { disabled-when { start-delay 1h; } }
}

include "extra.conf";
