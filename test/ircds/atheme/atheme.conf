/*
 * Atheme test fixture for the insp-atheme pairing: links to InspIRCd 4 on
 * inspircd:7000 (plaintext, the compose network only) as
 * services.insp.test. JSON-RPC at http://atheme:8080/jsonrpc and XML-RPC at
 * /xmlrpc (atheme.login with an account and password; no bearer token).
 */
loadmodule "protocol/inspircd";
loadmodule "backend/opensex";
loadmodule "crypto/pbkdf2v2";

loadmodule "nickserv/main";
loadmodule "nickserv/help";
loadmodule "nickserv/register";
loadmodule "nickserv/identify";
loadmodule "nickserv/logout";
loadmodule "nickserv/info";
loadmodule "nickserv/ghost";
loadmodule "nickserv/group";
loadmodule "nickserv/drop";
loadmodule "nickserv/set_core";
loadmodule "nickserv/set_password";
loadmodule "nickserv/set_email";
loadmodule "nickserv/status";
/* SET ENFORCE: the add-on federation e2e checks the bridge keeps remote
 * users off enforced nicks (test/setup/addon-federation.py). */
loadmodule "nickserv/enforce";
loadmodule "chanserv/main";
loadmodule "chanserv/help";
loadmodule "chanserv/register";
loadmodule "chanserv/info";
loadmodule "chanserv/flags";
loadmodule "chanserv/op";
loadmodule "chanserv/drop";
loadmodule "operserv/main";
loadmodule "operserv/help";
loadmodule "saslserv/main";
loadmodule "saslserv/plain";
loadmodule "saslserv/authcookie";
loadmodule "misc/httpd";
loadmodule "transport/jsonrpc";
loadmodule "transport/xmlrpc";

pbkdf2v2 { };

serverinfo {
	name = "services.insp.test";
	desc = "Atheme test fixture";
	numeric = "00A";
	recontime = 5;
	netname = "InspNet";
	hidehostsuffix = "users.insp.test";
	adminname = "Boson setup probe fixture";
	adminemail = "admin@insp.test";
	registeremail = "noreply@insp.test";
	mta = "/bin/true";
	loglevel = { admin; error; info; network; wallops; };
	maxcertfp = 0;
	maxlogins = 5;
	maxusers = 50;
	mdlimit = 30;
	emaillimit = 100;
	emailtime = 300;
	auth = none;
	casemapping = ascii; /* InspIRCd 4 default; the link fails on a mismatch */
};

uplink "irc.insp.test" {
	host = "inspircd";
	port = 7000;
	send_password = "fixture-link";
	receive_password = "fixture-link";
};

nickserv {
	nick = "NickServ";
	user = "NickServ";
	host = "services.insp.test";
	real = "Nickname Services";
	aliases { "ID" = "IDENTIFY"; };
	access { };
	maxnicks = 5;
	expire = 30;
	emailexempts { };
	/* seconds an unidentified user keeps an ENFORCE nick (default 30) */
	enforce_delay = 10;
};
chanserv {
	nick = "ChanServ";
	user = "ChanServ";
	host = "services.insp.test";
	real = "Channel Services";
	aliases { };
	access { };
	maxchans = 5;
	templates {
		vop = "+AV";
		hop = "+AHehitrv";
		aop = "+AOehiortv";
		sop = "+AOaefhiorstv";
		founder = "+AFORaefhiorstv";
	};
	expire = 30;
	maxchanacs = 0;
	maxfounders = 4;
};
operserv {
	nick = "OperServ";
	user = "OperServ";
	host = "services.insp.test";
	real = "Operator Services";
	aliases { };
	access { };
};
saslserv {
	nick = "SaslServ";
	user = "SaslServ";
	host = "services.insp.test";
	real = "SASL Authentication Agent";
};

httpd {
	host = "0.0.0.0";
	www_root = "/nonexistent";
	port = 8080;
};

logfile "var/atheme.log" { error; info; admin; network; register; };

general {
	uflags = { hidemail; };
	cflags = { verbose; };
	gflags = { none; };
	flood_msgs = 0;
	flood_time = 10;
	ratelimit_uses = 0;
	ratelimit_period = 60;
	kline_time = 7;
	clone_time = 0;
	default_clone_allowed = 50;
	default_clone_warn = 40;
	uplink_sendq_limit = 1048576;
	language = "en";
	exempts { };
	immune_level = immune;
	show_entity_id;
};

operclass "user" { };
operclass "sra" {
	privs {
		special:ircop;
		user:auspex; user:admin; chan:auspex; chan:admin; general:auspex; general:admin;
	};
	needoper;
};
