# InspIRCd 4 test fixture: TLS on 6697 (self-signed), plaintext on 6667, an
# Atheme link on 7000 (plaintext, the compose network only), and the modules
# a typical network loads: TLS, SASL, CAP and the IRCv3 set, chanhistory
# (InspIRCd 4 has no CHATHISTORY command) and the gateway module (WEBIRC)
# without a gateway block. Nothing Boson-specific: the setup wizard asks the
# admin to add that (test/ircds/run.sh apply appends it to extra.conf).
<server name="irc.insp.test" description="InspIRCd test fixture" network="InspNet">
<admin name="Boson setup probe fixture" nick="admin" email="admin@insp.test">

<module name="ssl_openssl">
<sslprofile name="Clients" provider="openssl" certfile="/certs/cert.pem" keyfile="/certs/key.pem" hash="sha256" requestclientcert="no">

<bind address="" port="6667" type="clients">
<bind address="" port="6697" type="clients" sslprofile="Clients">
<bind address="" port="7000" type="servers">

<connect name="main" allow="*" maxchans="20" timeout="20" pingfreq="2m" hardsendq="1M" softsendq="10240"
         recvq="10K" threshold="10" commandrate="1000" fakelag="yes" localmax="3" globalmax="3"
         resolvehostnames="no" useident="no" limit="5000" modes="+x">

<class name="Everything" commands="*" usermodes="*" chanmodes="*" privs="*" snomasks="*">
<type name="NetAdmin" classes="Everything">
<oper name="admin" password="fixture-oper" host="*@*" type="NetAdmin">

<files motd="/home/ircd/inspircd/conf/motd.txt">
<options prefixquit="Quit: " hostintopic="yes" defaultmodes="nt">
<security announceinvites="dynamic" hideserver="" userstats="Pu" customversion="">
<performance netbuffersize="10240" somaxconn="128" softlimit="1024" clonesonconnect="yes" timeskipwarn="2s" quietbursts="yes">
<log method="file" type="* -USERINPUT -USEROUTPUT" level="normal" target="ircd.log">

# Services: Atheme links in as services.insp.test.
<module name="spanningtree">
<link name="services.insp.test" ipaddr="atheme" port="7000" allowmask="*" sendpass="fixture-link" recvpass="fixture-link">
<services server="services.insp.test" silent="yes">
<module name="services">
<module name="account">
<module name="sasl">
<sasl target="services.insp.test">

# What a typical network loads.
<module name="cap">
<module name="ircv3">
<module name="ircv3_accounttag">
<module name="ircv3_batch">
<module name="ircv3_capnotify">
<module name="ircv3_chghost">
<module name="ircv3_ctctags">
<module name="ircv3_echomessage">
<module name="ircv3_invitenotify">
<module name="ircv3_labeledresponse">
<module name="ircv3_msgid">
<module name="ircv3_servertime">
<module name="chanhistory">
<chanhistory maxlines="50" prefixmsg="yes" bots="yes">
<module name="gateway">
<module name="cloak">
<module name="cloak_sha256">
<cloak method="hmac-sha256-addr" key="test-ircds-insp-cloak-key-0123456789abcdef" prefix="Clk-">
<module name="monitor">
<module name="multiprefix">
<module name="uhnames">
<module name="setname">
<module name="chghost">
<module name="sslinfo">
<module name="sslmodes">
<module name="alias">
<alias text="NICKSERV" replace="PRIVMSG NickServ :$2-" requires="NickServ" uline="yes">
<alias text="NS" replace="PRIVMSG NickServ :$2-" requires="NickServ" uline="yes">
<alias text="CHANSERV" replace="PRIVMSG ChanServ :$2-" requires="ChanServ" uline="yes">
<alias text="CS" replace="PRIVMSG ChanServ :$2-" requires="ChanServ" uline="yes">

<include file="/home/ircd/inspircd/conf/extra.conf">
