# ngIRCd 28 test fixture: TLS on 6697 (self-signed), plaintext on 6667.
# No WEBIRC password and nothing Boson-specific: those are what the setup
# wizard asks the admin to add (test/ircds/run.sh apply writes them to
# conf.d/extra.conf). The Anope link block is conf.d/services.conf, mounted
# only in the ngircd-anope pairing.
[Global]
	Name = irc.ngircd.test
	AdminInfo1 = Boson setup probe fixture
	AdminInfo2 = test/ircds
	AdminEMail = admin@ngircd.test
	Info = ngIRCd test fixture
	Network = NgircdNet
	Ports = 6667
	MotdFile = /etc/ngircd/ngircd.motd

[Limits]
	MaxConnectionsIP = 5
	MaxNickLength = 30

[Options]
	DNS = no
	Ident = no
	PAM = no
	OperCanUseMode = yes
	IncludeDir = /etc/ngircd/conf.d

[SSL]
	CertFile = /certs/cert.pem
	KeyFile = /certs/key.pem
	Ports = 6697

[Operator]
	Name = admin
	Password = fixture-oper
