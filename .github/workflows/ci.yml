name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helper:
    name: boson-ergo helper (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/ergo/helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: images/ergo/helper/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  smoke:
    name: local stack smoke (Traefik + auth + Ergo SASL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local .env (local CA, *.localhost)
        run: scripts/setup.sh --local
      - name: Start traefik, certsync, ergo, postgres, auth, quicvoiced, victoriametrics, wellknown
        env:
          COMPOSE_PROFILES: irc,voice,auth,metrics,wellknown
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Auth signup + IRC SASL (PLAIN, wrong password, OAUTHBEARER) + voice token
        run: |
          python3 scripts/smoke-irc.py --print-voice-token > smoke.out
          sed -E 's/^(VOICE_TOKEN ).*/\1<redacted>/' smoke.out
          awk '/^VOICE_TOKEN /{print $2}' smoke.out > voice-token && rm smoke.out
      - name: Voice room list (https://voice.localhost/v1/rooms) and discovery doc
        run: |
          c() { curl -sS --cacert local-certs/ca.pem "$@"; }
          code=$(c -o /dev/null -w '%{http_code}' https://voice.localhost/v1/rooms)
          [ "$code" = 401 ] || { echo "no token: $code, want 401"; exit 1; }
          c -f -H "Authorization: Bearer $(cat voice-token)" https://voice.localhost/v1/rooms |
            python3 -c 'import sys,json; r=json.load(sys.stdin)["rooms"]; assert r[0]["id"]=="general", r; print("rooms:", [x["id"] for x in r])'
          code=$(c -o /dev/null -w '%{http_code}' https://voice.localhost/metrics)
          [ "$code" = 404 ] || { echo "/metrics on the voice host: $code, want 404"; exit 1; }
          c -fD headers https://localhost/.well-known/boson.json |
            python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["version"]==1 and d["voice"]["addr"]=="voice.localhost:7700" and d["auth"]["url"]=="https://auth.localhost" and d["irc"]["host"]=="irc.localhost", d; print(d)'
          grep -qi '^access-control-allow-origin: \*' headers && grep -qi '^content-type: application/json' headers
      - name: VictoriaMetrics scrapes auth, quicvoiced and traefik
        env:
          COMPOSE_PROFILES: irc,voice,auth,metrics
        run: |
          for i in $(seq 1 30); do
            up=$(docker compose exec -T victoriametrics wget -qO- 'http://127.0.0.1:8428/api/v1/query?query=up' || true)
            n=$(echo "$up" | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(sum(1 for m in r if m["metric"]["job"] in ("auth","quicvoiced","traefik") and m["value"][1]=="1"))' 2>/dev/null || echo 0)
            [ "$n" = 3 ] && { echo "all 3 targets up"; exit 0; }
            sleep 5
          done
          echo "$up"; exit 1
      - name: Logs on failure
        if: failure()
        env:
          COMPOSE_PROFILES: irc,voice,auth,metrics,wellknown
        run: docker compose logs

  acme:
    name: ACME path (Pebble → Traefik → certsync → Ergo/quicvoiced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/setup.sh --local
      - run: test/acme/run.sh

  publish:
    name: publish images to Harbor
    needs: [helper, smoke, acme]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REGISTRY: harbor.floret.dev
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
    steps:
      - name: Check Harbor credentials
        id: creds
        run: |
          if [ -z "$HARBOR_USERNAME" ]; then
            echo "HARBOR_USERNAME/HARBOR_PASSWORD not set; skipping publish."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build + push harbor.floret.dev/boson/stack-*
        if: steps.creds.outputs.ok == 'true'
        run: |
          # <dir>:<tag>; every image also gets :sha-<commit>.
          for img in certsync:latest ergo:2.19.1; do
            name=${img%%:*}; tag=${img#*:}
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              -t $REGISTRY/boson/stack-$name:$tag \
              -t $REGISTRY/boson/stack-$name:sha-${GITHUB_SHA::7} images/$name
          done
