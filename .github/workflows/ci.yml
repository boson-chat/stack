name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Nightly: the add-on e2e for every IRC server (PRs run two of them).
  schedule:
    - cron: "17 3 * * *"
  # Run the smoke job against an unreleased auth: build boson-chat/auth at
  # this ref (compose.auth-src.yaml) instead of the newest Harbor release, and
  # fail instead of skipping the checks it should support (branding, email
  # templates). boson-chat/auth is private: needs the AUTH_REPO_TOKEN secret
  # (a read-only token for it).
  workflow_dispatch:
    inputs:
      auth_ref:
        description: "boson-chat/auth branch, tag or SHA to build (empty: newest release)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  helper:
    name: boson-ergo helper (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/ergo/helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: images/ergo/helper/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  webircgateway:
    name: webircgateway policy (Go, patched upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Upstream at the pinned commit + our patches and policy
        run: |
          commit=$(sed -n 's/^ARG WEBIRCGATEWAY_COMMIT=//p' images/webircgateway/Dockerfile)
          git clone -q https://github.com/kiwiirc/webircgateway.git /tmp/wig
          git -C /tmp/wig checkout -q "$commit"
          for p in images/webircgateway/patches/*.patch; do git -C /tmp/wig apply --whitespace=nowarn "$PWD/$p"; done
          cp images/webircgateway/src/*.go /tmp/wig/pkg/webircgateway/
          test -z "$(gofmt -l images/webircgateway/src)" || (gofmt -l images/webircgateway/src && exit 1)
      - working-directory: /tmp/wig
        run: go vet ./pkg/webircgateway/ && go test -race -count=1 ./pkg/webircgateway/

  smoke:
    name: local stack smoke (Traefik + auth + Ergo SASL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local .env (local CA, *.localhost)
        run: scripts/setup.sh --local
      - name: auth from source (workflow_dispatch auth_ref)
        if: inputs.auth_ref != ''
        uses: actions/checkout@v4
        with:
          repository: boson-chat/auth
          ref: ${{ inputs.auth_ref }}
          token: ${{ secrets.AUTH_REPO_TOKEN }}
          path: auth-src
      - name: Build auth from auth-src (compose.auth-src.yaml)
        if: inputs.auth_ref != ''
        run: printf 'COMPOSE_FILE=compose.yaml:compose.auth-src.yaml\nAUTH_SRC=./auth-src\n' >> .env
      - name: Video on (VIDEO_HOST; docs/video.md)
        run: echo "VIDEO_HOST=video.localhost" >> .env
      - name: Web gateway on (WEB_HOST; docs/web.md), small per-IP caps for the smoke
        run: printf 'WEB_HOST=chat.localhost\nWEBIRC_MAX_PER_IP=3\nWEBIRC_RATE_PER_MIN=8\n' >> .env
      - name: Start traefik, certsync, ergo, postgres, auth, quicvoiced, quicvideod, victoriametrics, node-exporter, wellknown, webircgateway
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics,wellknown,web
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Auth signup + IRC SASL (PLAIN, wrong password, OAUTHBEARER) + channel creation + voice token
        run: |
          # The policy Ergo rendered (from auth's channel_creation, or IRC_CHANNEL_CREATION).
          policy=registered
          docker compose exec -T ergo grep -q 'operator-only-creation: true' /ircd/ircd.yaml && policy=admins
          echo "channel_creation=$policy"
          python3 scripts/smoke-irc.py --print-voice-token --channel-creation "$policy" > smoke.out
          sed -E 's/^(VOICE_TOKEN ).*/\1<redacted>/' smoke.out
          awk '/^VOICE_TOKEN /{print $2}' smoke.out > voice-token && rm smoke.out
      - name: Voice room list (https://voice.localhost/v1/rooms) and discovery doc
        run: |
          c() { curl -sS --cacert local-certs/ca.pem "$@"; }
          code=$(c -o /dev/null -w '%{http_code}' https://voice.localhost/v1/rooms)
          [ "$code" = 401 ] || { echo "no token: $code, want 401"; exit 1; }
          c -f -H "Authorization: Bearer $(cat voice-token)" https://voice.localhost/v1/rooms |
            python3 -c 'import sys,json; r=json.load(sys.stdin)["rooms"]; assert r[0]["id"]=="general", r; print("rooms:", [x["id"] for x in r])'
          code=$(c -o /dev/null -w '%{http_code}' https://voice.localhost/metrics)
          [ "$code" = 404 ] || { echo "/metrics on the voice host: $code, want 404"; exit 1; }
          c -fD headers https://localhost/.well-known/boson.json |
            python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["version"]==1 and d["voice"]["addr"]=="voice.localhost:7700" and d["auth"]["url"]=="https://auth.localhost" and d["irc"]["host"]=="irc.localhost" and d["branding"]=="https://auth.localhost/v1/branding", d; print(d)'
          grep -qi '^access-control-allow-origin: \*' headers && grep -qi '^content-type: application/json' headers
      - name: Ergo API is internal only and answers with the token
        run: |
          tok=$(sed -n 's/^ERGO_API_TOKEN=//p' .env)
          [ -n "$tok" ] || { echo "setup.sh did not write ERGO_API_TOKEN"; exit 1; }
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q ergo)")
          w() { docker run --rm --network "$net" busybox:1.37.0 wget -qO- -T 5 "$@"; }
          w --header "Authorization: Bearer $tok" --post-data '{}' http://ergo:8089/v1/status |
            python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["success"], d; print("ergo api:", d["version"])'
          if w --post-data '{}' http://ergo:8089/v1/status 2>/dev/null; then echo "API answered without a token"; exit 1; fi
          if curl -s -m 3 http://127.0.0.1:8089/ >/dev/null; then echo "Ergo API is published on the host"; exit 1; fi
          if curl -sk -m 3 --cacert local-certs/ca.pem https://irc.localhost/v1/status -o /dev/null -w '%{http_code}' | grep -q 200; then echo "Ergo API routed by Traefik"; exit 1; fi
          echo ok
      - name: Voice channels API (quicvoice >= 1.5.0; skipped on older images)
        run: |
          c() { curl -sS --cacert local-certs/ca.pem "$@"; }
          tok=$(cat voice-token)
          code=$(c -o body -w '%{http_code}' -X POST https://voice.localhost/v1/rooms \
            -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d '{"name":"Smoke Room"}')
          if [ "$code" = 405 ]; then echo "quicvoiced has no POST /v1/rooms (< 1.5.0): skipped"; exit 0; fi
          # The smoke user is a regular user; the default policy (auth or
          # VOICE_CHANNEL_CREATION=admins) decides. Either way the answer
          # must agree with GET /v1/rooms' permissions.
          c -f -H "Authorization: Bearer $tok" https://voice.localhost/v1/rooms > list
          python3 - "$code" <<'PY'
          import json, sys
          code = int(sys.argv[1]); body = json.load(open("body")); perms = json.load(open("list"))["permissions"]
          print("POST /v1/rooms:", code, body); print("permissions:", perms)
          assert perms["create_scope"] in ("any", "founded_channels", "none"), perms
          if perms["create_scope"] == "any":
              assert code == 201 and body["kind"] == "dynamic" and body["can_manage"], body
          else:
              assert code == 403 and body["code"] == "forbidden", body
          PY
          if [ "$code" = 201 ]; then
            id=$(python3 -c 'import json; print(json.load(open("body"))["id"])')
            [ "$(c -o /dev/null -w '%{http_code}' -X DELETE "https://voice.localhost/v1/rooms/$id" -H "Authorization: Bearer $tok")" = 204 ]
          fi
          echo ok
      - name: channel_creation=admins reaches Ergo (env fallback; only when auth has no settings API)
        run: |
          docker compose exec -T ergo rm -f /ircd/boson-settings.json
          IRC_CHANNEL_CREATION=admins COMPOSE_PROFILES=irc,voice,auth,metrics,wellknown docker compose up -d --wait --wait-timeout 180 ergo
          if docker compose exec -T ergo grep -q 'operator-only-creation: true' /ircd/ircd.yaml; then
            python3 scripts/smoke-irc.py --channel-creation admins
          else
            echo "auth served channel_creation itself (not admins): skipped"
          fi
      - name: config/boson.yaml is owned by 65532, mode 644, and a hand edit reloads auth (skipped on auth without the config file)
        run: |
          own=$(docker run --rm -v "$PWD/config:/config:ro" busybox:1.37.0 stat -c '%u %a' /config/boson.yaml)
          [ "$own" = "65532 644" ] || { echo "config/boson.yaml is '$own', want '65532 644'"; exit 1; }
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q auth)")
          status() { docker run --rm --network "$net" busybox:1.37.0 wget -qO- -T 5 http://auth:8081/internal/config/status; }
          if ! before=$(status 2>/dev/null); then
            echo "auth has no /internal/config/status (older than the config-file release): skipped"; exit 0
          fi
          echo "before: $before"
          m0=$(echo "$before" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("file_mtime",""))')
          sleep 1 # a new mtime even on coarse filesystems
          # A hand edit, the way an editor saves (sed -i writes a new file and renames it).
          if grep -q '^auth:$' config/boson.yaml; then
            sudo sed -i '/^auth:$/a\  channel_expiry_days: 0' config/boson.yaml
          else
            printf 'auth:\n  channel_expiry_days: 0\n' | sudo tee -a config/boson.yaml >/dev/null
          fi
          for i in $(seq 1 30); do
            now=$(status || true)
            if echo "$now" | M0="$m0" python3 -c 'import os,sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get("ok") and d.get("file_mtime") != os.environ["M0"] else 1)' 2>/dev/null; then
              echo "auth reloaded: $now"; exit 0
            fi
            sleep 1
          done
          echo "auth didn't reload config/boson.yaml within 30 s: $now"; docker compose logs auth | tail -20; exit 1
      - name: Branding + email templates from config/boson.yaml, test mail to Mailpit (skipped on auth without /v1/branding)
        env:
          REQUIRE: ${{ inputs.auth_ref != '' }}
        run: |
          own=$(docker run --rm -v "$PWD/config:/config:ro" busybox:1.37.0 stat -c '%u %a' /config/branding)
          [ "$own" = "65532 755" ] || { echo "config/branding is '$own', want '65532 755'"; exit 1; }
          # Mailpit next to the stack (test-only file); auth is pointed at it through auth.smtp.
          docker compose -f compose.yaml -f test/branding/compose.mailpit.yaml up -d --no-deps --wait mailpit
          flags=""; [ "$REQUIRE" = true ] && flags=--require
          set -o pipefail
          python3 scripts/smoke-branding.py $flags | tee branding.out
          if grep -q '^SKIP ' branding.out; then
            echo "::notice::branding smoke skipped: $(grep -m1 '^SKIP ' branding.out | cut -c6-) (runs once the auth release with branding is the newest; or run this workflow with auth_ref)"
          fi
      - name: Role channels (private channel, auto-join on login and on role grant, rejoin once; skipped on auth without the role channel API)
        env:
          REQUIRE: ${{ inputs.auth_ref != '' }}
        run: |
          flags=""; [ "$REQUIRE" = true ] && flags=--require
          set -o pipefail
          python3 -u scripts/smoke-role-channels.py $flags | tee role-channels.out
          if grep -q '^SKIP ' role-channels.out; then
            echo "::notice::role channels smoke skipped: $(grep -m1 '^SKIP ' role-channels.out | cut -c6-) (runs once the auth release with role channels is the newest; or run this workflow with auth_ref)"
          fi
      - name: Video profile (https://video.localhost/v1/info; ticket JWKS on quicvoice >= 1.8.0, skipped on older images)
        run: |
          c() { curl -sS --cacert local-certs/ca.pem "$@"; }
          c -f https://video.localhost/v1/info |
            python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["quic_port"]==7710 and d["webtransport_path"]=="/wt", d; print("video info:", d)'
          code=$(c -o /dev/null -w '%{http_code}' https://video.localhost/metrics)
          [ "$code" = 404 ] || { echo "/metrics on the video host: $code, want 404"; exit 1; }
          code=$(c -o jwks.json -w '%{http_code}' https://voice.localhost/.well-known/video-jwks.json)
          if [ "$code" = 404 ]; then
            echo "::notice::video ticket JWKS skipped: the quicvoice image predates video tickets (boson-chat/quicvoice#9)"
            exit 0
          fi
          python3 -c 'import json; k=json.load(open("jwks.json"))["keys"]; assert len(k)==1 and k[0]["crv"]=="Ed25519", k; print("video JWKS kid", k[0]["kid"])'
          docker compose logs quicvoiced | grep -q "video for voice channels on"
      - name: VictoriaMetrics scrapes auth, quicvoiced, traefik and node (host metrics)
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics
        run: |
          for i in $(seq 1 30); do
            up=$(docker compose exec -T victoriametrics wget -qO- 'http://127.0.0.1:8428/api/v1/query?query=up' || true)
            n=$(echo "$up" | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(sum(1 for m in r if m["metric"]["job"] in ("auth","quicvoiced","traefik","node") and m["value"][1]=="1"))' 2>/dev/null || echo 0)
            [ "$n" = 4 ] && { echo "all 4 targets up"; exit 0; }
            sleep 5
          done
          echo "$up"; exit 1
      - name: node-exporter reports the host and is only reachable from the stack network
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics
        run: |
          q() { docker compose exec -T victoriametrics wget -qO- "http://127.0.0.1:8428/api/v1/query?query=$1"; }
          q 'up%7Bjob%3D%22node%22%2Cinstance%3D%22host%22%7D' |
            python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; assert len(r)==1 and r[0]["value"][1]=="1", r; print("up{job=node,instance=host} = 1")'
          q 'node_memory_MemAvailable_bytes%7Bjob%3D%22node%22%7D' |
            python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; assert len(r)==1 and float(r[0]["value"][1])>0, r; print("MemAvailable:", r[0]["value"][1])'
          # Host, not container: the host's interfaces (no veth/docker/br-) and a real root filesystem.
          q 'count%20by%20(device)%20(node_network_receive_bytes_total%7Bjob%3D%22node%22%7D)' |
            python3 -c 'import sys,json; d=[m["metric"]["device"] for m in json.load(sys.stdin)["data"]["result"]]; print("netdev:", d); assert d and not any(x.startswith(("veth","docker","br-","lo")) for x in d), d'
          q 'node_filesystem_size_bytes%7Bjob%3D%22node%22%2Cmountpoint%3D%22%2F%22%7D' |
            python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; assert r and r[0]["metric"]["fstype"]!="overlay", r; print("/:", r[0]["metric"]["fstype"], r[0]["value"][1])'
          # Bound to the stack gateway only: not on loopback or the runner's own address.
          if curl -s -m 3 http://127.0.0.1:9100/metrics >/dev/null; then echo "node-exporter answers on 127.0.0.1"; exit 1; fi
          ip=$(hostname -I | awk '{print $1}')
          if curl -s -m 3 "http://$ip:9100/metrics" >/dev/null; then echo "node-exporter answers on $ip"; exit 1; fi
          echo ok
      - name: Web gateway (wss://chat.localhost/webirc/websocket/ → Ergo with WEBIRC; refusals; per-IP caps)
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics,wellknown,web
        run: |
          set -o pipefail
          gw=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q webircgateway)")
          python3 scripts/smoke-webirc.py --gateway-ip "$gw"
      - name: Web client (https://chat.localhost; a guest on Ergo through the gateway; voice over WebTransport)
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics,wellknown,web
        working-directory: test/web
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          # QUIC (WebTransport) can't skip certificate checks: trust the local
          # certificate by its key.
          export SPKI=$(openssl x509 -in ../../local-certs/cert.pem -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | base64)
          # A fresh voice token (another smoke user): the first one may have lapsed.
          policy=registered
          (cd ../.. && docker compose exec -T ergo grep -q 'operator-only-creation: true' /ircd/ircd.yaml) && policy=admins
          VOICE_TOKEN=$(cd ../.. && python3 scripts/smoke-irc.py --print-voice-token --channel-creation "$policy" | awk '/^VOICE_TOKEN /{print $2}') npx playwright test
      - name: Logs on failure
        if: failure()
        env:
          COMPOSE_PROFILES: irc,voice,video,auth,metrics,wellknown,web
        run: docker compose logs

  directory:
    name: directory profile smoke (network key, fake DNS, paging, legacy /servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Directory image pullable? (skipped until the first release)
        id: img
        run: |
          img=$(sed -n 's/^ *image: \${DIRECTORY_IMAGE:-\(.*\)}$/\1/p' compose.yaml)
          [ -n "$img" ] || { echo "no DIRECTORY_IMAGE default in compose.yaml"; exit 1; }
          if docker pull -q "$img"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$img can't be pulled (not released yet?): directory smoke skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Local .env + test settings (fake DNS, legacy route on, no main peer)
        if: steps.img.outputs.ok == 'true'
        run: |
          scripts/setup.sh --local
          cat >> .env <<'EOF'
          DIRECTORY_ENV=development
          DIRECTORY_DNS_VERIFIER=fake
          DIRECTORY_INCLUDE_MAIN=false
          DIRECTORY_SERVES_LEGACY=true
          EOF
      - name: Start traefik, certsync, postgres, auth, directory
        if: steps.img.outputs.ok == 'true'
        env:
          COMPOSE_PROFILES: auth,directory
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Register (network key), verify, page by next_cursor, legacy /servers, delete
        if: steps.img.outputs.ok == 'true'
        run: python3 scripts/smoke-directory.py
      - name: Logs on failure
        if: failure() && steps.img.outputs.ok == 'true'
        env:
          COMPOSE_PROFILES: auth,directory
        run: docker compose logs

  files:
    name: files profile smoke (uploads, quota window, guests, expiry, headers)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: auth,files,wellknown
    steps:
      - uses: actions/checkout@v4
      - name: Files image pullable? (skipped until the release is published)
        id: img
        run: |
          img=${FILES_IMAGE:-$(sed -n 's/^ *image: \${FILES_IMAGE:-\(.*\)}$/\1/p' compose.yaml)}
          [ -n "$img" ] || { echo "no FILES_IMAGE default in compose.yaml"; exit 1; }
          if docker pull -q "$img"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$img isn't published yet: files smoke skipped"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Local .env + a files section with short test limits
        if: steps.img.outputs.ok == 'true'
        run: |
          scripts/setup.sh --local
          cat >> config/boson.yaml <<'EOF'
          files:
            enabled: true
            retention: 20s
            window: 30s
            account: { quota: 3MB, max_file: 2MB }
            guest: { enabled: true, quota: 1MB, max_file: 512KB }
          EOF
      - name: Start traefik, certsync, postgres, auth, files, wellknown
        if: steps.img.outputs.ok == 'true'
        run: docker compose up -d --wait --wait-timeout 300
      - name: Upload, headers, range, quota, no refund, guests, discovery, expiry, rolling window
        if: steps.img.outputs.ok == 'true'
        run: python3 scripts/smoke-files.py
      - name: Logs on failure
        if: failure() && steps.img.outputs.ok == 'true'
        run: docker compose logs files auth postgres

  minio:
    name: minio profile (bucket, bucket-only user, idempotent init)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: minio
    steps:
      - uses: actions/checkout@v4
      - run: scripts/setup.sh --local
      - name: Start minio, run minio-init twice
        run: |
          docker compose up -d --wait --wait-timeout 180 minio
          docker compose run --rm minio-init
          docker compose run --rm minio-init
      - name: The files user can use its bucket and nothing else
        run: |
          set -a; . ./.env; set +a
          net=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}' "$(docker compose ps -q minio)")
          mc() { docker run --rm --network "$net" -e MC_CONFIG_DIR=/tmp/.mc --entrypoint sh bitnamilegacy/minio-client:2025.7.21-debian-12-r3 -c "mc alias set f http://minio:9000 '$FILES_S3_ACCESS_KEY' '$FILES_S3_SECRET_KEY' >/dev/null && $1"; }
          mc "printf hi > /tmp/x && mc cp -q /tmp/x f/boson-files/smoke && mc cat f/boson-files/smoke && mc rm f/boson-files/smoke"
          if mc "mc mb f/other-bucket" 2>/dev/null; then echo "files user could create a bucket"; exit 1; fi
          if mc "mc admin info f" 2>/dev/null; then echo "files user has admin access"; exit 1; fi
          pub=$(docker inspect -f '{{range $p, $b := .NetworkSettings.Ports}}{{if $b}}{{$p}} {{end}}{{end}}' "$(docker compose ps -q minio)")
          [ -z "$pub" ] || { echo "minio publishes $pub on the host"; exit 1; }
          echo ok
      - name: Logs on failure
        if: failure()
        run: docker compose logs minio minio-init

  nick-claim:
    name: nick claims (api profile; off by default, hot reload, Mailpit POP3)
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: auth,api
    steps:
      - uses: actions/checkout@v4
      - name: Local .env + the test mailbox's password (test/nickclaim/pop3-auth)
        run: |
          scripts/setup.sh --local
          echo 'NICK_CLAIM_POP3_PASSWORD=smoke-pop3-password' >> .env
      - name: Start traefik, certsync, postgres, auth, api, Mailpit (POP3)
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose -f compose.yaml -f test/nickclaim/compose.mailpit.yaml up -d --no-deps --wait mailpit
      - name: Disabled by default (403 / status), enable in config/boson.yaml, worker polls Mailpit (skipped on an api without nick_claim)
        run: |
          set -o pipefail
          python3 scripts/smoke-nick-claim.py | tee nick.out
          if grep -q '^SKIP ' nick.out; then
            echo "::notice::nick-claim smoke skipped: $(grep -m1 '^SKIP ' nick.out | cut -c6-) (runs once the backend release with nick_claim is the API_IMAGE default)"
          fi
          if grep -q '^NOTE ' nick.out; then
            echo "::notice::$(grep -m1 '^NOTE ' nick.out | cut -c6-)"
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose logs api api-migrate auth

  roles:
    name: network roles + channel lifecycle on a real Ergo (patched image + fake auth, RoleServ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/roles/run.sh fake

  acme:
    name: ACME path (Pebble → Traefik → certsync → Ergo/quicvoiced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/setup.sh --local
      - run: test/acme/run.sh

  probe:
    name: setup probe (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/probe/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  ircds:
    name: IRC fixture ${{ matrix.pairing }} (smoke, probe golden, config snippet)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pairing: ngircd-anope, ircd: ngircd }
          - { pairing: unreal-anope, ircd: unrealircd }
          - { pairing: insp-atheme, ircd: inspircd }
          - { pairing: ngircd, ircd: ngircd }
    env:
      PAIRING: ${{ matrix.pairing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/probe/go.mod
      - name: Build from pinned source and start (test/ircds/run.sh up)
        run: test/ircds/run.sh up "$PAIRING"
      - name: Smoke (TLS, NickServ REGISTER + IDENTIFY, SASL PLAIN when offered, services RPC)
        env:
          SMOKE_ARGS: --nick bosonprobe --password probe-fixture-pass
        run: test/ircds/run.sh smoke "$PAIRING"
      - name: Probe vs pkg/probe/testdata/golden/${{ matrix.pairing }}.json
        working-directory: pkg/probe
        run: PROBE_FIXTURE="$PAIRING" PROBE_GOLDEN_OUT="$RUNNER_TEMP/probe-out" go test -count=1 -run TestGolden -v .
      - name: A broken snippet is refused and rolled back
        run: |
          if printf 'this is { not a config\n' | test/ircds/run.sh apply "$PAIRING"; then
            echo "run.sh apply accepted a broken snippet"; exit 1
          fi
          test/ircds/run.sh smoke "$PAIRING"
      - name: Apply the WEBIRC snippet (test/ircds/snippets/webirc.${{ matrix.ircd }}.conf), probe again
        run: |
          test/ircds/run.sh apply "$PAIRING" "test/ircds/snippets/webirc.${{ matrix.ircd }}.conf"
          cd pkg/probe && PROBE_FIXTURE="$PAIRING" PROBE_WEBIRC_APPLIED=1 PROBE_GOLDEN_OUT="$RUNNER_TEMP/probe-out" go test -count=1 -run TestGolden -v .
      - name: Probe output (the tables to compare with testdata/golden)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.pairing }}
          path: ${{ runner.temp }}/probe-out/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: test/ircds/run.sh logs "$PAIRING"
      - name: Down
        if: always()
        run: test/ircds/run.sh down "$PAIRING"

  bridgesync:
    name: bridge-sync (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/bridgesync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: images/bridgesync/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  setup:
    name: setup wizard (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: images/setup/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./... && go vet -tags dev ./...
      - run: go test -race -count=1 ./...
      - name: install.sh is POSIX sh
        working-directory: .
        run: sh -n install.sh && shellcheck install.sh test/setup/run.sh test/setup/run-addon.sh test/setup/hooks.sh test/federation/run.sh && sh -n images/wellknown/serve.sh

  setup-e2e:
    name: setup wizard e2e (install.sh → wizard → Pebble ACME → working stack → re-run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --yes, the wizard with Playwright (error cases, fake DNS, Pebble), the result, a re-run
        run: test/setup/run.sh
      - name: Screenshots of every step (desktop + phone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-screenshots
          path: test/setup/shots/
          if-no-files-found: ignore
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-wizard-traces
          path: test/setup/test-results/
          if-no-files-found: ignore

  # Federated login between two full installs on one runner (home.test and
  # remote.test, separate compose projects, Pebble certificates, the
  # remote's own directory): test/federation/run.sh, docs/federation.md.
  federation-e2e:
    name: federation e2e (two installs, home -> remote sign-in, IRC, uploads, voice, ban)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: home.test + remote.test, alice signs in on the remote with her home account
        run: test/federation/run.sh

  # The add-on path ("Add Boson to my existing IRC server") against each IRC
  # server fixture: test/setup/run-addon.sh. Pull requests run ngircd-anope
  # (NickServ accounts over Anope's RPC) and unreal-anope (Boson accounts,
  # the +draft/react module); main, the nightly run and manual runs add
  # insp-atheme (NickServ over Atheme's RPC) and ngircd (no services).
  setup-addon-e2e:
    name: setup add-on e2e (${{ matrix.pairing }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pairing: ${{ fromJSON(github.event_name == 'pull_request' && '["ngircd-anope","unreal-anope"]' || '["ngircd-anope","unreal-anope","insp-atheme","ngircd"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: IRC server up, install.sh, the add-on path (Playwright), snippets applied, the result over the bridge
        run: test/setup/run-addon.sh "${{ matrix.pairing }}"
      - name: Screenshots of every step (desktop + phone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-addon-screenshots-${{ matrix.pairing }}
          path: test/setup/shots/
          if-no-files-found: ignore
      - name: Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-addon-traces-${{ matrix.pairing }}
          path: test/setup/test-results/
          if-no-files-found: ignore

  publish:
    name: publish images to Harbor
    needs: [bridgesync, setup-addon-e2e, federation-e2e, helper, webircgateway, smoke, directory, files, minio, nick-claim, roles, acme, probe, ircds, setup, setup-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REGISTRY: harbor.floret.dev
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
    steps:
      - name: Check Harbor credentials
        id: creds
        run: |
          if [ -z "$HARBOR_USERNAME" ]; then
            echo "HARBOR_USERNAME/HARBOR_PASSWORD not set; skipping publish."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ok == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build + push harbor.floret.dev/boson/stack-*
        if: steps.creds.outputs.ok == 'true'
        run: |
          # <dir>:<tag>; every image also gets :sha-<commit>.
          for img in certsync:latest ergo:2.19.1 webircgateway:1.1.0-boson.2 bridgesync:0.1.0; do
            name=${img%%:*}; tag=${img#*:}
            docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              -t $REGISTRY/boson/stack-$name:$tag \
              -t $REGISTRY/boson/stack-$name:sha-${GITHUB_SHA::7} images/$name
          done
      - name: Build + push harbor.floret.dev/boson/stack-setup (install.sh's wizard; repo-root context, it carries the stack files)
        if: steps.creds.outputs.ok == 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --push \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $REGISTRY/boson/stack-setup:latest \
            -t $REGISTRY/boson/stack-setup:sha-${GITHUB_SHA::7} \
            -f images/setup/Dockerfile .
