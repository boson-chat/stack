# boson stack config: config/boson.yaml (docs/config.md)
#
# One file for the whole stack's NON-SECRET settings. Every service reads
# its own section (auth:, branding:, irc:, voice:, directory:, nick_claim:,
# files:, roles:, admin:, plus network:) and picks up changes within a few seconds: no restart,
# except for the few keys marked "restart" below (the admin panel offers
# the restart).
#
# Precedence: a value here > the service's env var (.env) > built-in
# default. A key that's absent (or commented out) means "use the env value".
# Removing a key resets it to that default.
#
# The admin panel edits this file (Network settings, Branding, Emails,
# Directory, Voice, IRC, Nick registration, Uploads, Config file pages). It keeps your comments, key
# order and unknown keys, and notes who saved last in a comment on the
# `version:` line. You can also edit it by hand; it belongs to uid 65532
# (config-init sets that on every `docker compose up`), so use sudo:
#
#   sudo $EDITOR config/boson.yaml
#
# A file that doesn't parse is never used: every service keeps its last good
# config and logs the error with its line; the admin panel shows it in a
# banner until it's fixed.
#
# Secrets (passwords, tokens, keys, SMTP_USER/SMTP_PASSWORD,
# NICK_CLAIM_POP3_PASSWORD, FILES_S3_ACCESS_KEY/FILES_S3_SECRET_KEY, DSNs) never go
# here: they stay in .env. So do deployment values: hostnames, images,
# published ports, internal URLs.
#
# Below is a commented-out reference of every key. The admin panel adds the
# sections it sets right under `version:`; to set something by hand, add it
# there too (or uncomment it here: keep the two-space indent).

version: 1

# ---- network: the whole stack --------------------------------------------------
# network:
#   # The network's display name: sign-in pages and emails (auth), the IRC
#   # network name (ergo), the directory's default name.
#   # Default: NETWORK_NAME.
#   name: Boson

# ---- auth: accounts, sign-up and channel rules (auth service) --------------------
# Without this file auth keeps these in its database (admin panel: Network
# settings); with it, the database copy is read-only and this file wins.
# auth:
#   # Who can create an account: open | invite | closed.
#   # Default: REGISTRATION.
#   registration: open
#   # New accounts must verify their email before signing in.
#   # Default: REQUIRE_EMAIL_VERIFICATION.
#   require_email_verification: true
#   # Let people connect to IRC with just a nickname (no account).
#   # Default: true (IRC_REQUIRE_SASL=true on ergo turns guests off).
#   guest_access: true
#   # Let guests (no account) join voice rooms, and so video, under their
#   # IRC nick with a guest badge. Nicks that belong to an account are
#   # refused; rooms limited to channel members or roles stay closed to
#   # guests. Only takes effect while guest_access is true (auth 1.18+).
#   # Default: false.
#   guest_voice: false
#   # Who can create text channels: registered | admins.
#   # Default: IRC_CHANNEL_CREATION (ergo) / registered.
#   channel_creation: registered
#   # Who can create voice rooms: admins | founders | registered.
#   # Default: VOICE_CHANNEL_CREATION (quicvoiced) / admins.
#   voice_channel_creation: admins
#   # ChanServ registers a channel to the signed-in user who creates it.
#   channel_auto_register: true
#   # Unregister channels idle this many days; 0 = never (max 3650).
#   channel_expiry_days: 0
#   # Extra browser origins allowed to call auth with credentials and to be
#   # SSO return_to targets (e.g. the directory web UI).
#   # Default: AUTH_CORS_ALLOWED_ORIGINS.
#   cors_allowed_origins: [https://directory.example.com]
#   # Outgoing email. SMTP_USER / SMTP_PASSWORD stay in .env.
#   # Defaults: SMTP_HOST, SMTP_PORT, SMTP_FROM, SMTP_TLS (starttls | tls | none).
#   smtp:
#     host: smtp.example.com
#     port: 587
#     from: "Boson <hi@example.com>"
#     tls: starttls
#   # How the account emails look and read (docs/branding.md). With this
#   # section (even empty) auth sends its branded layout; without it, Boson's
#   # built-in emails. Every key is optional. The admin panel's Emails page
#   # edits it, with a preview and a "Send test" button.
#   email:
#     # The From display name; also the name at the top when there's no logo.
#     # Default: the name in auth.smtp.from (SMTP_FROM), which also gives the
#     # address.
#     sender_name: "Example Chat"
#     # Top border, buttons and links in the HTML part: #rrggbb.
#     # Default: Boson's (#3b5bdb).
#     accent: "#7c3aed"
#     # One line under every email (plain text, no HTML; {{network}} works).
#     footer: "Example Chat · example.com"
#     # Put the network's logo at the top: branding.images.logo_wide, else
#     # branding.images.logo. false = no logo.
#     logo: true
#     # Subject and body per email; any subset, and either key alone. The body
#     # is plain text: a blank line starts a paragraph and URLs become links.
#     # No HTML (it's shown as typed). Variables:
#     #   {{network}}   network.name        {{username}}  the account
#     #   {{link}}      the action's URL    {{expires}}   how long {{link}} works
#     #   {{inviter}}   who sent the invite (invite only)
#     # An unknown {{name}} stays as it is. Removing a template (or the
#     # panel's "Reset to default") brings back Boson's wording.
#     templates:
#       verification:            # confirm the email address after sign-up
#         subject: "Confirm your {{network}} account"
#         body: "Hi {{username}},\n\nConfirm your email address: {{link}}\n\nThe link works for {{expires}}."
#       password_reset:          # "forgot password"
#         subject: "Reset your {{network}} password"
#         body: "Hi {{username}},\n\nSet a new password: {{link}}\n\nThe link works for {{expires}}. If you didn't ask, ignore this email."
#       account_setup:           # an admin created the account; the user picks a password
#         subject: "Your {{network}} account is ready"
#         body: "Hi {{username}},\n\nChoose your password: {{link}}\n\nThe link works for {{expires}}."
#       invite:                  # an invite to sign up (registration: invite)
#         subject: "{{inviter}} invited you to {{network}}"
#         body: "{{inviter}} invited you to {{network}}.\n\nCreate your account: {{link}}\n\nThe invite works for {{expires}}."

# ---- branding: the network's look in the boson client (auth service) --------------
# Theme colors, pane backgrounds, logo and sign-in background, served to the
# client at https://AUTH_HOST/v1/branding (and listed in
# /.well-known/boson.json). Users see it while this network is the active
# one, unless they turn network themes off. The admin panel's Branding page
# edits this and uploads the images; docs/branding.md has the whole story.
# branding:
#   # The theme (boson-theme/1) without image URLs: those come from `images`.
#   # Validation: colors #rrggbb only; unknown keys are dropped; at most 16 KB.
#   theme:
#     # Tokens you leave out come from Boson's built-in theme of this base:
#     # dark | light.
#     base: dark
#     # Any subset of the client's theme tokens (accent, bg, fg, ...).
#     colors:
#       accent: "#7c3aed"
#       bg: "#0b0b10"
#     # Nickname colors: saturation and lightness, 0-100.
#     nick: { saturation: 62, lightness: 64 }
#     # Corner radius in px, 0-12.
#     radius: 2
#     # boson | system (the OS's UI font).
#     font: boson
#     # Per pane (servers, channels, messages, members): a background color,
#     # and for an image (set in `images` below) how much to dim it (0-1),
#     # blur it (0-24 px) and where to anchor it (center|top|bottom|left|right).
#     panes:
#       servers:  { bg: "#0b0b10" }
#       channels: { bg: "#111118" }
#       messages: { dim: 0.7, blur: 8, position: center }
#       members:  { bg: "#111118" }
#   # Image files in config/branding/ (next to this file), by slot. png,
#   # jpeg, webp, gif or svg; at most 2 MB and 4096 px on a side. The panel
#   # names its uploads <slot>-<hash>.<ext>; by hand any name works.
#   images:
#     logo: logo.svg                    # square-ish mark: server rail, sidebar, sign-in
#     logo_wide: wordmark.svg           # optional wordmark: headers and emails
#     login_background: login.webp      # sign-in / sign-up screen
#     panes.messages.image: messages.webp   # also panes.servers/channels/members.image

# ---- irc: Ergo (rendered into ircd.yaml by the boson-ergo helper) ----------------
# irc:
#   # Plain-text IRC listener (no TLS). restart: it's a listener.
#   # Default: IRC_PLAINTEXT.
#   plaintext: false
#   # Its port inside the container. restart. compose publishes the
#   # container's 6667 (IRC_PLAINTEXT_PORT in .env is the host side), so
#   # change both or leave this alone; the admin panel doesn't offer it.
#   plaintext_port: 6667
#   # IPs/CIDRs that may connect without signing in while guest access is off.
#   # Default: IRC_REQUIRE_SASL_EXEMPT.
#   require_sasl_exempt: [127.0.0.1/32]
#   # How often network roles are re-read from auth, in seconds (ergo and
#   # RoleServ). Default: ROLES_POLL_SECONDS (10).
#   roles_poll_seconds: 10
#   # How often auth's channel_creation / guest_access are re-read, in
#   # seconds. Default: SETTINGS_POLL_SECONDS (30).
#   settings_poll_seconds: 30
#   # WebSocket listener for web clients (wss://IRC_HOST/webirc).
#   # Default: IRC_WEBSOCKET (true).
#   websocket: true
#   # Origins allowed to open those WebSockets; empty = any.
#   # Default: IRC_WEBSOCKET_ORIGINS.
#   websocket_origins: [https://chat.example.com]
#   # SASL OAUTHBEARER (sign in with an auth token). Default: IRC_OAUTHBEARER (true).
#   oauthbearer: true
#   # Keep channel history on disk across restarts. restart.
#   # Default: IRC_PERSISTENT_HISTORY (true).
#   persistent_history: true
#   # How long history is kept (Ergo durations: 7d, 1w2d; 0 = forever).
#   history_expire: 7d
#   # Ergo's log level: debug, info, warn, error.
#   log_level: info
#
#   # ---- network channels (read by auth, enforced by RoleServ; docs/irc-channels.md
#   # "Network channels") ----
#   # Channels that always exist and belong to the network: RoleServ creates
#   # and registers them (founder below) and they never expire, so nobody can
#   # create one first and take it over. With auth.channel_creation: admins,
#   # members can only join these, role channels and channels that already
#   # exist. Up to 100. Admin panel: Settings → Network channels.
#   channels:
#     - name: "#lobby"            # #, then 1-63 printable ASCII, no space/comma
#       topic: "Welcome!"         # optional; set when it changes here (a /topic on IRC stays until then)
#       # New accounts are joined on their first login (a /part sticks: auth
#       # records it), and guests / clients without an account when they
#       # connect (once per nick per 24 h). Default: false.
#       autojoin: true
#     - name: "#help"
#   # The account network channels are registered to. A channel already
#   # registered to someone else is left with them. Default: the earliest
#   # Owner (auth), else RoleServ.
#   channel_founder: thelion
#   # Also join guests and clients without an account to the auto-join
#   # channels when they connect. Default: true.
#   autojoin_guests: true

# ---- roles: role channels (auth; enforced by RoleServ) ----------------------------
# Channels are attached to roles (and "everyone") and marked private in the
# admin panel's Roles page; see docs/roles.md "Role channels".
# roles.channels.autojoin only joins channels assigned to roles (Roles →
# Channels); with no role channels it does nothing. Channels everyone joins
# are irc.channels (autojoin: true) above.
# roles:
#   channels:
#     # RoleServ joins members to their roles' auto-join channels when they
#     # log in and when they gain a role. Default: ROLE_CHANNELS_AUTOJOIN (false).
#     autojoin: false
#     # login: at every login, even after a /part. once: only the first time
#     # a role gives the channel (a /part sticks). Default: login.
#     rejoin: login

# ---- voice: quicvoiced ----------------------------------------------------------
# voice:
#   # Static voice rooms, in display order: id (lowercase, a-z 0-9 -) and name.
#   # Default: VOICE_ROOMS ("general:General").
#   rooms:
#     - { id: general, name: General }
#   # true = only listed rooms and ones created through the API can be
#   # joined; false = any name makes an ad-hoc room.
#   # Default: VOICE_ROOMS_STRICT.
#   rooms_strict: true
#   # Voice rooms one user may create. Default: VOICE_ROOMS_MAX_PER_USER (10).
#   max_rooms_per_user: 10
#   # Rooms the server holds at once, and people per room (0 = no limit).
#   max_rooms: 0
#   max_participants: 0
#   # Voice bitrate cap in kbit/s (quicvoiced >= 1.13): the most a person
#   # sends in rooms without their own cap; a room's own: max_kbps on its
#   # entry in rooms, like { id: music, name: Music, max_kbps: 128 }. The app
#   # sends min(the person's Voice quality: 32 / 64 / 128, the cap). Advisory:
#   # quicvoiced announces it (older apps ignore it). Default: no cap.
#   max_kbps: 0
#   # Caches (live): how long auth's settings and Ergo's founder answers are reused.
#   settings_ttl: 30s
#   ergo_cache_ttl: 30s
#   # Listeners and datagram limits. restart: quicvoiced only reads them at start.
#   quic_addr: ":7700"
#   http_addr: ":8080"
#   public_http_addr: ":8090"
#   max_datagrams_per_sec: 0
#   max_datagram_payload: 0
#   # `rooms` also accepts bare ids: rooms: [general, gaming]

# ---- directory: the stack's own directory (directory profile) --------------------
# Without this file the directory keeps these in its database (admin panel:
# Directory); with it, this file wins.
# directory:
#   # Shown in /.well-known/boson-directory.json.
#   # Defaults: DIRECTORY_NAME, DIRECTORY_OPERATOR, DIRECTORY_CONTACT.
#   name: Boson directory
#   operator: Boson
#   contact: hi@example.com
#   # Include the boson main directory's listings (each re-checked against
#   # its own DNS). Default: DIRECTORY_INCLUDE_MAIN.
#   include_main: true
#   # The main directory. Default: DIRECTORY_MAIN_PEER.
#   main_peer_url: https://directory.boson.chat
#   # How often peers are synced (5m … 24h).
#   sync_every: 10m
#   # Other directories to federate with. Default: DIRECTORY_PEERS. Peers
#   # added in the panel are kept in the directory's peer table as before.
#   peers: [https://dir.example.net]

# ---- nick_claim: register users' nicks on other IRC networks (api profile) ---------
# Off by default. When on, the boson app can register a user's nick with
# NickServ on ANOTHER network for them: the api hands NickServ an address
# like reg+<user>-<token>@<email_domain>, reads the confirmation email from
# the inbound mailbox and gives the code back to the app. Needs a mailbox
# that receives every reg+...@<email_domain> (plus-addressing or a
# catch-all) and the api profile. docs/nick-claim.md has the mail setup and
# the privacy notes. The admin panel's Nick claims page edits this section
# and has a "Test connection" button for the mailbox.
# nick_claim:
#   # The switch. false: POST /me/nick-claims answers 403
#   # nick_claim_disabled and the mailbox is never polled.
#   # Default: NICK_CLAIM_ENABLED (false).
#   enabled: false
#   # The domain in the addresses handed to NickServ. Its MX must deliver
#   # reg+anything@ to the inbound mailbox below. A subdomain (e.g.
#   # nick.example.com) keeps this mail apart from your own.
#   # Default: NICK_CLAIM_EMAIL_DOMAIN (DOMAIN).
#   email_domain: example.com
#   # Claims one user may start per hour; 429 after that.
#   # Default: NICK_CLAIM_RATE_LIMIT_PER_HOUR (5).
#   rate_limit_per_hour: 5
#   # The mailbox the worker polls every few seconds. Use one that holds
#   # nothing else: mail that isn't a confirmation for a pending claim is
#   # DELETED. Separate from auth.smtp (outgoing). The password is a
#   # secret: NICK_CLAIM_POP3_PASSWORD in .env, never here.
#   # Defaults: POP3_HOST, POP3_PORT (995), POP3_TLS (true), POP3_USER.
#   inbound:
#     # pop3 is the only protocol so far.
#     protocol: pop3
#     host: pop3.example.com
#     # 995 = POP3 over TLS; 110 with tls: false (only on a trusted network).
#     port: 995
#     tls: true
#     user: reg@example.com

# ---- files: uploads with a rolling quota (files profile) ---------------------------
# Off by default. When on, people upload files (images, video, documents)
# that the boson app links in chat, served from FILES_HOST. Every upload
# counts against a per-person quota over a rolling window; deleting a file
# removes it at once but doesn't give the space back until its upload has
# left the window. Files are deleted `retention` after upload. Needs the
# files profile (docs/files.md). The admin panel's Uploads page edits this
# section; auth reads files.enabled too (files_url in its GET /v1/config,
# so apps only offer uploads while it's on).
#
# Sizes: a byte count or a number with a unit (5GB, 500MB). KB/MB/GB/TB are
# decimal (1GB = 1000MB = 1,000,000,000 bytes); KiB/MiB/GiB/TiB are binary
# (1GiB = 1024MiB). Durations: Go durations (72h, 30m, 90s).
# Everything applies live except storage.driver and storage.s3.*, which
# need a restart of files (docker compose restart files; the panel offers it).
# files:
#   # The switch. false: uploads answer 503 uploads_disabled and apps hide the attach
#   # button. Existing files stay until they expire.
#   # Default: FILES_ENABLED (false).
#   enabled: false
#   # How long a file is kept after its upload. Default: 72h.
#   retention: 72h
#   # The rolling quota window: what one person uploaded in the last
#   # `window` counts against their quota. Default: 72h.
#   window: 72h
#   # Signed-in accounts.
#   account:
#     quota: 5GB        # per person per window
#     max_file: 100MB   # per file
#   # Guests (no account): short-lived guest tokens, limited per token and
#   # per IP (the IP gets 3x the quota).
#   guest:
#     enabled: true
#     quota: 500MB
#     max_file: 25MB
#   storage:
#     # local: the files_data volume. s3: any S3-compatible store (the
#     # minio profile, Cloudflare R2, AWS S3).
#     driver: local     # restart
#     # Refuse uploads (507 storage_full) that would leave less than this
#     # free. local: the volume's free space. s3: what's left of capacity.
#     min_free: 2GB
#     # s3 only, optional: a total budget for what files keeps in the bucket
#     # (S3 has no free-space API), e.g. 15GB for the minio profile on a
#     # VPS disk with ~24 GB free. Without it s3 has no guard.
#     # capacity: 15GB
#     s3:               # restart
#       # minio profile: http://minio:9000. R2:
#       # https://<account id>.r2.cloudflarestorage.com.
#       endpoint: ""
#       bucket: ""
#       region: auto
#       # Bucket in the path (MinIO); false = virtual-hosted style.
#       path_style: true
#       # Empty (recommended): every download goes through files' /f/,
#       # which sets the safe headers. Set to serve straight from the
#       # bucket's public URL or a CDN instead.
#       public_base_url: ""
#     # The keys are secrets: FILES_S3_ACCESS_KEY / FILES_S3_SECRET_KEY in
#     # .env, never here.

# ---- admin: the admin panel itself -----------------------------------------------
# admin:
#   # Register / edit this network's listing in the boson directory from the
#   # Directory page. Default: ADMIN_DIRECTORY_REGISTRATION (true).
#   directory_registration: true
#   # The IRC hostname the Directory page lists and checks.
#   # Default: IRC_HOST (the admin's IRC_CHECK_SERVER_NAME).
#   directory_hostname: irc.example.com
#   # Certificates the Overview watches: host:port, optionally
#   # @dial-host:dial-port to reach it from inside the stack. Up to 20.
#   # Default: ADMIN_TLS_CHECK_HOSTS, else every CERT_HOSTS hostname (443
#   # via traefik; IRC_HOST on 6697).
#   tls_check_hosts: [irc.example.com:6697, voice.example.com:443@traefik:443]
