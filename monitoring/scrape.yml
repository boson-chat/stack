# VictoriaMetrics scrape config (Prometheus format). Targets that aren't
# running (e.g. profile disabled) just show up as down.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]   # --metrics.prometheus on Traefik's internal entrypoint
  - job_name: quicvoiced
    static_configs:
      - targets: ["quicvoiced:8080"]
  - job_name: quicvideod
    static_configs:
      - targets: ["quicvideod:8080"]   # video profile; down (no data) otherwise
  - job_name: auth
    static_configs:
      - targets: ["auth:8081"]   # internal listener serves /metrics
  - job_name: admin
    static_configs:
      - targets: ["admin:8081"]
  # pushrelay profile; down (no data) otherwise. Its internal listener
  # serves /metrics (pushrelay_upstream_requests_total{result="ok"}: pushes
  # delivered to APNs / FCM, the usage stats' features.push_sent_24h).
  - job_name: pushrelay
    static_configs:
      - targets: ["pushrelay:3001"]
  # Host metrics (node-exporter, metrics profile). It runs on the host network,
  # bound to the stack network's gateway; victoriametrics maps
  # host.docker.internal to that address (NODE_EXPORTER_ADDR). instance is
  # fixed to "host" so queries don't depend on the address.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: host
