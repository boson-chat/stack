# VictoriaMetrics scrape config (Prometheus format). Targets that aren't
# running (e.g. profile disabled) just show up as down.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]   # --metrics.prometheus on Traefik's internal entrypoint
  - job_name: quicvoiced
    static_configs:
      - targets: ["quicvoiced:8080"]
  - job_name: quicvideod
    static_configs:
      - targets: ["quicvideod:8080"]   # video profile; down (no data) otherwise
  - job_name: auth
    static_configs:
      - targets: ["auth:8081"]   # internal listener serves /metrics
  - job_name: admin
    static_configs:
      - targets: ["admin:8081"]
