# boson stack: Traefik (TLS + routing), Ergo (IRC), auth + Postgres
# (accounts), quicvoiced (voice), VictoriaMetrics + node-exporter (metrics).
# Configure in .env (see .env.example / scripts/setup.sh), then:
#   docker compose up -d --build
# Which parts run is chosen by COMPOSE_PROFILES in .env
# (irc, voice, video, auth, api, directory, files, minio, metrics, admin,
# updates, webroot, wellknown, web, bridge, pushrelay). traefik and
# certsync always run.
# Install-specific additions: traefik/dynamic/*.yml and compose.override.yaml.
name: boson

x-restart: &restart
  restart: unless-stopped

networks:
  default:
    # Fixed subnet so the auth service (TRUSTED_PROXIES) and Ergo
    # (proxy-allowed-from) can trust X-Forwarded-For from Traefik.
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.203.53.0/24}
  # Only the admin panel and the Docker socket proxy are on it; internal, so
  # it has no route out.
  docker-proxy:
    internal: true

services:
  # ---- config/boson.yaml (docs/config.md) -------------------------------------
  # The stack's one non-secret config file. The admin panel writes it, every
  # service reads its own section and reloads on change. This creates it from
  # config/boson.example.yaml when missing and hands it to uid 65532 (the
  # admin panel's user; everyone else only reads). Exits when done.
  # config/branding/ holds the network's branding images (docs/branding.md):
  # the panel writes them there, auth serves them; files dropped in by hand
  # (sudo cp) are made readable for auth and removable by the panel.
  #
  # Services mount the config DIRECTORY, not the file: the panel saves by
  # writing a temp file and renaming it over boson.yaml, and a single-file
  # bind mount would keep showing the old inode. Only admin mounts it rw.
  config-init:
    image: busybox:1.37.0
    command:
      - sh
      - -c
      - >-
        [ -f /config/boson.yaml ] || cp /config/boson.example.yaml /config/boson.yaml;
        mkdir -p /config/branding &&
        chown 65532:65532 /config /config/boson.yaml &&
        chown -R 65532:65532 /config/branding &&
        chmod 755 /config && chmod 644 /config/boson.yaml &&
        chmod -R u+rwX,go+rX,go-w /config/branding
    volumes:
      - ./config:/config
    restart: "no"

  traefik:
    <<: *restart
    image: traefik:v3.7.19
    # Where :80 and :443 are published. Default: every address, the
    # internet's way in. Behind a reverse proxy you already run on 80/443
    # (docs/reverse-proxy.md): a private address it forwards to, such as
    # 127.0.0.1:8081 / 127.0.0.1:8444.
    ports:
      - "${TRAEFIK_HTTP_PUBLISH:-80}:80"
      - "${TRAEFIK_HTTPS_PUBLISH:-443}:443"
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --log.nocolor=true
      - --ping=true
      - --metrics.prometheus=true
      # Only this compose project's containers, and only those with traefik.enable=true.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # STACK_PROJECT: only when the stack runs under another compose project
      # name (docker compose -p NAME), as the federation e2e's two installs do.
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`${STACK_PROJECT:-boson}`)
      # traefik/dynamic: the stack's cert routers (stack.yml) + your own files.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Everything on :80 redirects to https, except ACME HTTP-01 challenges.
      # allowACMEByPass also lets a more specific router (e.g. the webroot
      # profile) answer challenges for a host whose cert Traefik doesn't manage.
      - --entrypoints.web.allowacmebypass=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Behind a reverse proxy (docs/reverse-proxy.md): the PROXY protocol
      # header (v1 or v2) from TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS carries
      # each visitor's own address, on both entrypoints; X-Forwarded-For on
      # :80 is kept from those addresses too. Connections from anywhere else
      # (or without a header) are taken as they are. Empty = off. Traefik
      # refuses an empty trustedips list, so when it's unset each of these
      # lines is a second --ping=true instead.
      - "${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:+--entrypoints.websecure.proxyprotocol.trustedips=}${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:---ping=true}"
      - "${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:+--entrypoints.web.proxyprotocol.trustedips=}${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:---ping=true}"
      - "${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:+--entrypoints.web.forwardedheaders.trustedips=}${TRAEFIK_PROXY_PROTOCOL_TRUSTED_IPS:---ping=true}"
      # Uploads (files profile) may take up to FILES_UPLOAD_TIMEOUT (30m) to
      # send their body; Traefik's default read timeout (60s) would cut
      # them off. Applies to the whole entrypoint (there's only one :443);
      # idle keep-alive connections still close after 180s.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=${TRAEFIK_READ_TIMEOUT:-35m}
      - --entrypoints.websecure.transport.respondingtimeouts.idletimeout=${TRAEFIK_IDLE_TIMEOUT:-180s}
      # Drop headers like X_Forwarded_For that alias the ones Traefik sets.
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --certificatesresolvers.le.acme.email=${TLS_ISSUER:?set TLS_ISSUER in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.keytype=${ACME_KEY_TYPE:-EC256}
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    environment:
      # Read by traefik/dynamic/stack.yml.
      CERT_HOSTS: ${CERT_HOSTS:-${IRC_HOST:?set IRC_HOST in .env},${VOICE_HOST:?set VOICE_HOST in .env},${AUTH_HOST:?set AUTH_HOST in .env}}
      TLS_ISSUER: ${TLS_ISSUER}
      # Read by traefik/dynamic/directory.yml: true = the directory profile
      # answers https://API_HOST/servers* (the old api directory's paths).
      DIRECTORY_SERVES_LEGACY: ${DIRECTORY_SERVES_LEGACY:-false}
      API_HOST: ${API_HOST:-api.${DOMAIN:-localhost}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./local-certs:/local-certs:ro
      - traefik_acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  certsync:
    <<: *restart
    build: images/certsync
    image: harbor.floret.dev/boson/stack-certsync:latest
    environment:
      TLS_ISSUER: ${TLS_ISSUER}
      ACME_JSON: /acme/acme.json
      CERTSYNC_TARGETS: >-
        ${IRC_HOST}:/certs/irc:10000:fullchain.pem:privkey.pem
        ${VOICE_HOST}:/certs/voice:65532:tls.crt:tls.key
        ${VIDEO_HOST:-}:/certs/video:65532:tls.crt:tls.key
        ${BRIDGE_CERT_HOST:-}:/certs/bridge:1000:fullchain.pem:privkey.pem
    volumes:
      - traefik_acme:/acme:ro
      - ./local-certs:/local-certs:ro
      - certs_irc:/certs/irc
      - certs_voice:/certs/voice
      - certs_video:/certs/video
      - certs_bridge:/certs/bridge
    depends_on: [traefik]

  # ---- irc ------------------------------------------------------------------
  ergo:
    <<: *restart
    profiles: [irc]
    build: images/ergo
    image: harbor.floret.dev/boson/stack-ergo:2.19.1
    ports:
      - "6697:6697"
      - "${IRC_PLAINTEXT_PORT:-127.0.0.1:6667}:6667"
    environment:
      # config/boson.yaml (irc:, network:) wins over the env defaults below.
      BOSON_CONFIG: /config/boson.yaml
      IRC_HOST: ${IRC_HOST}
      DOMAIN: ${DOMAIN:-}
      # Default; config/boson.yaml network.name wins.
      NETWORK_NAME: ${NETWORK_NAME:-Boson}
      AUTH_HOST: ${AUTH_HOST}
      OPER_NAME: ${OPER_NAME:-admin}
      OPER_PASSWORD_HASH: ${OPER_PASSWORD_HASH:-}
      # Default; config/boson.yaml irc.plaintext wins (needs a restart).
      IRC_PLAINTEXT: ${IRC_PLAINTEXT:-false}
      IRC_WEBSOCKET: ${IRC_WEBSOCKET:-true}
      IRC_WEBSOCKET_ORIGINS: ${IRC_WEBSOCKET_ORIGINS:-}
      IRC_OAUTHBEARER: ${IRC_OAUTHBEARER:-true}
      IRC_PERSISTENT_HISTORY: ${IRC_PERSISTENT_HISTORY:-true}
      # An emptied unregistered channel's creator keeps ops this long (0 =
      # off; docs/irc-channels.md "Creator grace"). Default;
      # config/boson.yaml irc.channel_creator_grace wins.
      IRC_CHANNEL_CREATOR_GRACE: ${IRC_CHANNEL_CREATOR_GRACE:-10m}
      # Signed-in users stay connected with no device open (disabled |
      # opt-in | opt-out | mandatory). Default; config/boson.yaml
      # irc.always_on wins.
      IRC_ALWAYS_ON: ${IRC_ALWAYS_ON:-opt-out}
      # Push notifications (draft/webpush, docs/push.md): Ergo POSTs
      # encrypted pushes to browser push services and the push relay over
      # the internet (HTTPS, public IPs only). Defaults; config/boson.yaml
      # irc.push / irc.push_delay win.
      IRC_PUSH: ${IRC_PUSH:-true}
      IRC_PUSH_DELAY: ${IRC_PUSH_DELAY:-20s}
      STACK_SUBNET: ${STACK_SUBNET:-10.203.53.0/24}
      # auth-script → auth service (internal listener, never published)
      AUTH_VERIFY_URL: http://auth:8081/internal/v1/verify-password
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Text channel creation follows the auth service's channel_creation
      # setting (registered | admins), polled every SETTINGS_POLL_SECONDS;
      # a change re-renders ircd.yaml and rehashes Ergo. IRC_CHANNEL_CREATION
      # is used until auth answers the first time. See docs/irc-channels.md.
      AUTH_SETTINGS_URL: http://auth:8081/internal/v1/settings
      IRC_CHANNEL_CREATION: ${IRC_CHANNEL_CREATION:-registered}
      SETTINGS_POLL_SECONDS: ${SETTINGS_POLL_SECONDS:-30}
      # Guests (no account) follow auth's guest_access setting (admin panel),
      # polled like channel_creation; IRC_REQUIRE_SASL=true (no guests) is
      # the default with an auth older than 1.8. IRC_REQUIRE_SASL_EXEMPT:
      # IPs/CIDRs that may skip the login while guests are off.
      IRC_REQUIRE_SASL: ${IRC_REQUIRE_SASL:-false}
      # Default; config/boson.yaml irc.require_sasl_exempt wins.
      IRC_REQUIRE_SASL_EXEMPT: ${IRC_REQUIRE_SASL_EXEMPT:-}
      IRC_IP_LIMITS_EXEMPT: ${IRC_IP_LIMITS_EXEMPT:-}
      # Ergo's HTTP API on :8089 for quicvoiced (founder checks, channel
      # roles), RoleServ and the role sync. Compose network only: not
      # published, not routed. Empty = off.
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      # The web gateway (profile web) passes web users' real IPs with WEBIRC
      # from the stack network (WEBIRC_HOSTS, default STACK_SUBNET). Empty =
      # no WEBIRC (docs/web.md).
      WEBIRC_PASSWORD: ${WEBIRC_PASSWORD:-}
      WEBIRC_HOSTS: ${WEBIRC_HOSTS:-}
      # Network roles (docs/roles.md): oper classes from auth's roles, polled
      # every ROLES_POLL_SECONDS; members' oper class / WHOIS line / vhost
      # are applied at login and pushed to connected users on a change.
      IRC_ROLES: ${IRC_ROLES:-true}
      # Default; config/boson.yaml irc.roles_poll_seconds wins.
      ROLES_POLL_SECONDS: ${ROLES_POLL_SECONDS:-10}
      IRC_ROLE_BASE_CAPABILITIES: ${IRC_ROLE_BASE_CAPABILITIES:-nofakelag}
      AUTH_INTERNAL_URL: http://auth:8081
      AUTH_PUBLIC_URL: http://auth:8080
      ERGO_API_URL: http://127.0.0.1:8089
      ROLESERV_NICK: RoleServ
    volumes:
      - certs_irc:/certs:ro
      - ergo_db:/ircd
      - ./config:/config:ro
    depends_on:
      certsync:
        condition: service_started
      config-init:
        condition: service_completed_successfully
    labels:
      # WebSocket for web clients: wss://IRC_HOST/webirc
      - traefik.enable=true
      - traefik.http.routers.webirc.rule=Host(`${IRC_HOST}`) && PathPrefix(`/webirc`)
      - traefik.http.routers.webirc.entrypoints=websecure
      - traefik.http.routers.webirc.tls=true
      - traefik.http.services.webirc.loadbalancer.server.port=8097
    healthcheck:
      # Listening on 6697 (checked without connecting, so no log noise).
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':6697 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  # RoleServ: /msg RoleServ HELP. Network roles for any IRC client; changes
  # are made by auth as the caller's account (docs/roles.md). Same image as
  # ergo, connects to its services listener (6680, never published).
  roleserv:
    <<: *restart
    profiles: [irc]
    # Same build as ergo (so `up --build` never pulls an older image for it).
    build: images/ergo
    image: harbor.floret.dev/boson/stack-ergo:2.19.1
    entrypoint: ["/usr/local/bin/boson-ergo"]
    command: ["roleserv"]
    environment:
      ROLESERV_IRC_ADDR: ergo:6680
      ROLESERV_NICK: RoleServ
      ERGO_API_URL: http://ergo:8089
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      AUTH_INTERNAL_URL: http://auth:8081
      AUTH_PUBLIC_URL: http://auth:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      AUTH_ACTING_TOKEN: ${ROLESERV_AUTH_TOKEN:-}
      BOSON_CONFIG: /config/boson.yaml
      # Default; config/boson.yaml irc.roles_poll_seconds wins.
      ROLES_POLL_SECONDS: ${ROLES_POLL_SECONDS:-10}
      IRC_ROLE_BASE_CAPABILITIES: ${IRC_ROLE_BASE_CAPABILITIES:-nofakelag}
      # Role channels (docs/roles.md): every channel pushed again this often.
      ROLE_CHANNELS_RESYNC_SECONDS: ${ROLE_CHANNELS_RESYNC_SECONDS:-300}
    volumes:
      - ./config:/config:ro
      # The private channels RoleServ locked (to unlock them when they turn public).
      - roleserv_data:/roleserv
    depends_on:
      ergo:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully

  # ---- auth -----------------------------------------------------------------
  # ---- bridge (Boson next to an existing IRC server, docs/bridge.md) ---------
  # Instead of Ergo (no irc profile): Boson apps connect to IRC_HOST:6697,
  # which is evrd in managed mode (4evrd/evrd docs/managed.md), an IRCv3
  # bridge that connects each signed-in Boson user to your IRC server
  # (BRIDGE_IRC_SERVER) with WEBIRC, and gives Boson message tags, history,
  # read markers and the rest. Classic IRC users keep using your server.
  # Nothing Boson users see names the bridge.
  #
  # evrd-links is evrd's connection holder: it keeps every user's IRC
  # connection (and their clients' connections) open while evrd restarts
  # or is updated, and evrd runs in its network namespace. It's pinned to
  # its own image (EVRD_LINKS_IMAGE): updating the stack (or evrd) never
  # recreates it, so nobody drops off IRC. Restarting it drops everyone:
  # never restart it to update (the admin panel's Updates must not either).
  evrd-links:
    <<: *restart
    profiles: [bridge]
    image: ${EVRD_LINKS_IMAGE:-ghcr.io/4evrd/evrd:0.60.0}
    entrypoint: ["evrd-links", "-socket", "/run/evrd-links/links.sock"]
    command: []
    ports:
      - "6697:6697"
    volumes:
      - bridge_links:/run/evrd-links
  evrd:
    <<: *restart
    profiles: [bridge]
    image: ${EVRD_IMAGE:-ghcr.io/4evrd/evrd:0.62.0}
    network_mode: "service:evrd-links"
    # Waits for its certificate (certsync copies IRC_HOST's from Traefik);
    # evrd re-reads it when it changes.
    entrypoint: ["sh", "-c", "until [ -s /certs/fullchain.pem ] && [ -s /certs/privkey.pem ]; do sleep 2; done; exec evrd -config /etc/evrd/evrd.conf"]
    command: []
    environment:
      # Secrets; the rest is bridge/evrd.conf (written by Boson setup).
      EVRD_MANAGED_TOKEN: ${BRIDGE_TOKEN:-}
      EVRD_MANAGED_WEBIRC_PASSWORD: ${BRIDGE_WEBIRC_PASSWORD:-}
      # The web gateway's WEBIRC to the bridge (WEBIRC_PASSWORDS evrd-links=):
      # each web user's own address, for guests and for the IRC server.
      EVRD_MANAGED_CLIENT_WEBIRC_PASSWORD: ${BRIDGE_CLIENT_WEBIRC_PASSWORD:-}
      EVRD_SECRET_KEY: ${BRIDGE_SECRET_KEY:-}
    volumes:
      - ./bridge/evrd.conf:/etc/evrd/evrd.conf:ro
      - bridge_data:/var/lib/evrd
      - bridge_links:/run/evrd-links
      - certs_bridge:/certs:ro
    depends_on:
      evrd-links:
        condition: service_started
      certsync:
        condition: service_started
      auth:
        condition: service_started
    healthcheck:
      # The managed API's health (compose network only, never published).
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Authorization: Bearer $$EVRD_MANAGED_TOKEN\" http://127.0.0.1:8098/api/managed/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  postgres:
    <<: *restart
    profiles: [auth]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: auth
      # First start only: also create the API's database (api profile).
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      API_DB_USER: ${API_DB_USER:-api}
      API_DB_NAME: ${API_DB_NAME:-api}
      # ... and the directory's (directory profile).
      DIRECTORY_DB_PASSWORD: ${DIRECTORY_DB_PASSWORD:-}
      DIRECTORY_DB_USER: ${DIRECTORY_DB_USER:-directory}
      DIRECTORY_DB_NAME: ${DIRECTORY_DB_NAME:-directory}
      # ... and the files service's (files profile).
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:-}
      FILES_DB_USER: ${FILES_DB_USER:-files}
      FILES_DB_NAME: ${FILES_DB_NAME:-files}
      # ... and the push relay's (pushrelay profile).
      PUSHRELAY_DB_PASSWORD: ${PUSHRELAY_DB_PASSWORD:-}
      PUSHRELAY_DB_USER: ${PUSHRELAY_DB_USER:-pushrelay}
      PUSHRELAY_DB_NAME: ${PUSHRELAY_DB_NAME:-pushrelay}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth", "-d", "auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *restart
    profiles: [auth]
    # Releases: harbor.floret.dev/boson/auth:<version>. To run an unreleased
    # checkout instead, add compose.auth-src.yaml (see README).
    image: ${AUTH_IMAGE:-harbor.floret.dev/boson/auth:1.31.0}
    environment:
      ENV: production
      LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      # config/boson.yaml (auth:, network:) wins over the env defaults below
      # and replaces the network settings auth kept in its database.
      BOSON_CONFIG: /config/boson.yaml
      # Default; config/boson.yaml network.name wins.
      SITE_NAME: ${NETWORK_NAME:-Boson}
      PUBLIC_URL: https://${AUTH_HOST}
      ISSUER: https://${AUTH_HOST}
      APP_URL: ${AUTH_APP_URL:-https://${AUTH_HOST}}
      # Where users go back to after verifying their email (auth >= the
      # release with boson-chat/auth#26; older auth ignores it). Default: the
      # web client (https://WEB_HOST/, the web profile), else auth's own page.
      WEB_CLIENT_URL: ${AUTH_WEB_CLIENT_URL:-${WEB_HOST:+https://${WEB_HOST}/}}
      # Extra browser origins allowed to call auth with credentials/tokens and
      # to be SSO return_to targets, e.g. the directory web UI
      # (https://directory.example.com). Comma-separated. Default;
      # config/boson.yaml auth.cors_allowed_origins wins. The web client
      # (WEB_HOST, the web profile) is on the list by default: it calls
      # auth from the browser and comes back to /sso/callback after SSO.
      CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-${WEB_HOST:+https://${WEB_HOST}}}
      DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ${AUTH_KEY_ENCRYPTION_KEY:?run scripts/setup.sh}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run scripts/setup.sh}
      # Traefik's X-Forwarded-For is trusted (client IPs for rate limits/audit).
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # Defaults; config/boson.yaml auth.registration,
      # auth.require_email_verification and auth.smtp.{host,port,from,tls}
      # win. SMTP_USER / SMTP_PASSWORD are secrets and stay here.
      REGISTRATION: ${REGISTRATION:-open}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      # RoleServ's token for the acting endpoints (/internal/v1/acting/*):
      # changes made on behalf of the IRC user who asked. docs/roles.md.
      INTERNAL_ACTING_TOKEN: ${ROLESERV_AUTH_TOKEN:-}
      # GET /v1/config files_url: the files profile's public URL, published
      # only while uploads are on (FILES_ENABLED default; config/boson.yaml
      # files.enabled wins). Safe to set without the files profile.
      FILES_PUBLIC_URL: https://${FILES_HOST:-files.${DOMAIN:-localhost}}
      # Friends: "People in my servers" (who may send you friend requests)
      # asks Ergo's API whether two people share a channel (irc profile).
      # Empty ERGO_API_TOKEN = that setting lets nobody through. Friends and
      # private calls need nothing else here (docs/friends-calls.md).
      ERGO_API_URL: ${AUTH_ERGO_API_URL:-http://ergo:8089}
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      FILES_ENABLED: ${FILES_ENABLED:-false}
      # Accounts: local (auth's own, the default) or nickserv (an existing
      # IRC network's NickServ accounts; auth >= 1.23.0, docs/bridge.md).
      # Boson setup writes these on the
      # "Add Boson to my existing IRC server" path.
      ACCOUNT_BACKEND: ${ACCOUNT_BACKEND:-local}
      NICKSERV_STRATEGY: ${NICKSERV_STRATEGY:-}
      NICKSERV_SERVICES: ${NICKSERV_SERVICES:-}
      NICKSERV_RPC_URL: ${NICKSERV_RPC_URL:-}
      NICKSERV_RPC_TOKEN: ${NICKSERV_RPC_TOKEN:-}
      NICKSERV_IRC_ADDR: ${NICKSERV_IRC_ADDR:-}
      NICKSERV_IRC_TLS: ${NICKSERV_IRC_TLS:-true}
      NICKSERV_TLS_PIN_SHA256: ${NICKSERV_TLS_PIN_SHA256:-}
      NICKSERV_ALLOW_PLAINTEXT: ${NICKSERV_ALLOW_PLAINTEXT:-false}
      NICKSERV_SERVICES_SERVER: ${NICKSERV_SERVICES_SERVER:-}
      # Boson sign-up registers NickServ accounts (Atheme RPC only); off, or
      # with another strategy, sign-up shows NICKSERV_SIGNUP_MESSAGE (empty =
      # "register on IRC with /msg NickServ REGISTER"). config/boson.yaml
      # auth.nickserv.registration / signup_message win (auth >= the release
      # with those keys).
      NICKSERV_REGISTRATION: ${NICKSERV_REGISTRATION:-true}
      NICKSERV_SIGNUP_MESSAGE: ${NICKSERV_SIGNUP_MESSAGE:-}
      # Bridge accounts (bridge profile, auth >= 1.25.0, auth docs/bridge.md):
      # auth gives every Boson account its account on the bridge through
      # evrd's managed API on the compose network, and hands it the NickServ
      # login after each NickServ sign-in. On when BRIDGE_CERT_HOST is set
      # (the add-on path); empty = off. BRIDGE_NICKSERV_METHOD: how the bridge
      # identifies NickServ accounts (sasl | nickserv | auto; empty = auth's
      # default); setup writes nickserv for an IRC server without SASL.
      BRIDGE_API_URL: ${AUTH_BRIDGE_API_URL:-${BRIDGE_CERT_HOST:+http://evrd-links:8098}}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      BRIDGE_NICKSERV_METHOD: ${BRIDGE_NICKSERV_METHOD:-}
      # Federated login (docs/federation.md, auth >= 1.24.0): people with an
      # account on another Boson server sign in here with it, and people
      # from here on other servers. FEDERATION_DOMAIN is this install's
      # boson_domain: the domain whose /.well-known/boson.json (wellknown
      # profile) lists this auth. auth's default is AUTH_HOST without
      # "auth." (= DOMAIN on a usual install); set it in .env when AUTH_HOST
      # isn't auth.DOMAIN. The rest are defaults: config/boson.yaml
      # auth.federation.{mode,allow,block,directory_url,remote_upload_quota,
      # remote_voice} wins (the admin panel's Federation page writes them).
      FEDERATION_DOMAIN: ${FEDERATION_DOMAIN:-}
      FEDERATION_MODE: ${FEDERATION_MODE:-directory}
      FEDERATION_ALLOW: ${FEDERATION_ALLOW:-}
      FEDERATION_BLOCK: ${FEDERATION_BLOCK:-}
      FEDERATION_DIRECTORY_URL: ${FEDERATION_DIRECTORY_URL:-https://directory.boson.chat}
      FEDERATION_REMOTE_ROLE: ${FEDERATION_REMOTE_ROLE:-Remote}
      # Handles always carry the home domain (alice-bosonchat) where the
      # bridge fronts an existing IRC server (auto), docs/bridge.md.
      FEDERATION_HANDLE_SUFFIX: ${FEDERATION_HANDLE_SUFFIX:-auto}
      FEDERATION_REMOTE_UPLOAD_QUOTA: ${FEDERATION_REMOTE_UPLOAD_QUOTA:-}
      FEDERATION_REMOTE_MAX_FILE: ${FEDERATION_REMOTE_MAX_FILE:-}
      FEDERATION_REMOTE_VOICE: ${FEDERATION_REMOTE_VOICE:-true}
      # Remote users' upload quota is a per-user override on the files
      # service (files profile), set through its internal API. Without the
      # profile the pushes fail quietly and are retried at the next sign-in.
      FILES_INTERNAL_URL: ${AUTH_FILES_INTERNAL_URL-http://files:3001}
      FILES_INTERNAL_TOKEN: ${FILES_INTERNAL_TOKEN:-}
      # Workload issuer (auth >= the release with boson-chat/auth workload
      # identity; older auth ignores these): short-lived ES256 tokens for the
      # stack's own services at https://AUTH_HOST/workload, e.g. the push
      # relay's keyless FCM access through Google Workload Identity
      # Federation (docs/push.md "FCM without a Google key"). name:audience
      # pairs; empty (default) = off, /workload/* is 404. Each name needs
      # its own secret; the relay's is PUSHRELAY_WORKLOAD_TOKEN.
      WORKLOAD_IDENTITIES: ${WORKLOAD_IDENTITIES:-}
      WORKLOAD_TOKEN_PUSHRELAY: ${PUSHRELAY_WORKLOAD_TOKEN:-}
    volumes:
      # Read-only: boson.yaml (auth:, network:, branding:) and the branding
      # images in config/branding/, served at /v1/branding/assets/.
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${AUTH_HOST}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls=true
      # Public listener only. The internal one (8081: /internal/v1, /metrics)
      # is reachable inside the compose network and never routed.
      - traefik.http.services.auth.loadbalancer.server.port=8080

  # ---- voice ----------------------------------------------------------------
  # Makes the voice_data volume writable for quicvoiced (uid 65532), also when
  # it was first created by an image without /data. Exits when done.
  voice-data-init:
    profiles: [voice]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 750 /data"]
    volumes:
      - voice_data:/data
    restart: "no"

  quicvoiced:
    <<: *restart
    profiles: [voice]
    image: ${QUICVOICE_IMAGE:-harbor.floret.dev/boson/quicvoice:1.16.0}
    ports:
      - "7700:7700/udp"
    environment:
      ENV: production
      QUIC_ADDR: ":7700"
      # Internal: /healthz, /version, /metrics. Never routed.
      HTTP_ADDR: ":8080"
      # Public API (GET /v1/rooms, /healthz), routed at https://VOICE_HOST.
      PUBLIC_HTTP_ADDR: ":8090"
      # Browsers (Boson web clients) join over WebTransport on the QUIC port
      # (https://VOICE_HOST:7700/wt) and call the public API cross-origin.
      # Pages allowed, default "directory": this stack's web client
      # (WEB_HOST) plus the web clients of the Boson servers verified in
      # the directories auth follows (auth's /v1/web-origins, ORIGINS_URL;
      # a newly verified server gets in within ~15 min). * = any page, or a
      # comma-separated list of origins (mixable with directory). See
      # docs/voice.md#browsers-which-pages. config/boson.yaml voice.web_origins wins.
      WEBTRANSPORT_ORIGINS: ${VOICE_WEBTRANSPORT_ORIGINS:-directory${WEB_HOST:+,https://${WEB_HOST}}}
      ORIGINS_URL: ${VOICE_ORIGINS_URL:-http://auth:8080/v1/web-origins}
      # config/boson.yaml (voice:) wins over the env defaults below.
      BOSON_CONFIG: /config/boson.yaml
      # Default; config/boson.yaml voice.rooms wins.
      # Static voice channels: comma-separated id:Display Name, in display order.
      VOICE_ROOMS: ${VOICE_ROOMS:-general:General}
      # true = only registry rooms (VOICE_ROOMS + ones created through the
      # API) can be joined; false = any name makes an ad-hoc room.
      # Default; config/boson.yaml voice.rooms_strict wins.
      VOICE_ROOMS_STRICT: ${VOICE_ROOMS_STRICT:-true}
      # Room registry (dynamic voice channels), in the voice_data volume.
      VOICE_ROOMS_DB: /data/rooms.json
      # Default; config/boson.yaml voice.max_rooms_per_user wins.
      VOICE_ROOMS_MAX_PER_USER: ${VOICE_ROOMS_MAX_PER_USER:-10}
      VOICE_ROOMS_MAX: ${VOICE_ROOMS_MAX:-500}
      # Who may create voice channels: the auth service's
      # voice_channel_creation setting (admins | founders | registered),
      # cached 30s. VOICE_CHANNEL_CREATION until auth answers.
      AUTH_INTERNAL_URL: http://auth:8081
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      VOICE_CHANNEL_CREATION: ${VOICE_CHANNEL_CREATION:-admins}
      # Founder checks and IRC role locks via Ergo's API (irc profile).
      # Empty ERGO_API_TOKEN = no IRC roles (only admins pass role locks).
      ERGO_API_URL: ${VOICE_ERGO_API_URL:-http://ergo:8089}
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      # Add-on installs (bridge profile, no Ergo): IRC guests' channel
      # membership for "Only people in #channel" voice channels, by nick,
      # from evrd's managed API (quicvoice 1.17+ = boson-chat/quicvoice#22, evrd with
      # /api/managed/channels/…/members/…; older ones keep those channels
      # locked for guests). Unused while Ergo's API is configured.
      BRIDGE_API_URL: ${VOICE_BRIDGE_API_URL:-${BRIDGE_CERT_HOST:+http://evrd-links:8098}}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE: /certs/tls.key
      # Tokens from the auth service (POST /v1/voice/token), verified via JWKS.
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: quicvoice
      # Optional: HS256 tokens from `quicvoiced token` (legacy / testing).
      JWT_SECRET: ${VOICE_JWT_SECRET:-}
      # Video in voice channels (docs/video.md; quicvoice 1.8+). VIDEO_HOST
      # set = on: quicvoiced hands people in a channel a ticket for its video
      # room on quicvideod (video profile, or a remote node), signed with the
      # key in voice_data, and keeps quicvideod's rooms in step with voice.
      VIDEO_QUIC_URL: ${VIDEO_QUIC_URL:-${VIDEO_HOST:+quic://${VIDEO_HOST}:7710}}
      VIDEO_WEBTRANSPORT_URL: ${VIDEO_WEBTRANSPORT_URL:-${VIDEO_HOST:+https://${VIDEO_HOST}:7710/wt}}
      VIDEO_TICKET_KEY_FILE: /data/video-ticket.key
      # quicvideod's control listener: the local video profile by default;
      # https://VIDEO_HOST/control for a remote node (compose.video-node.yaml).
      VIDEO_CONTROL_URL: ${VIDEO_CONTROL_URL:-${VIDEO_HOST:+http://quicvideod:8091}}
      VIDEO_CONTROL_TOKEN: ${VIDEO_CONTROL_TOKEN:-}
    volumes:
      - certs_voice:/certs:ro
      - voice_data:/data
      - ./config:/config:ro
    depends_on:
      certsync:
        condition: service_started
      voice-data-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
    labels:
      # https://VOICE_HOST → the public API listener only (8090). The
      # internal one (8080: /metrics) is reachable inside the compose
      # network and never routed. VOICE_HOST's certificate is already in
      # CERT_HOSTS (quicvoiced uses it for QUIC too).
      - traefik.enable=true
      - traefik.http.routers.voice.rule=Host(`${VOICE_HOST}`)
      - traefik.http.routers.voice.entrypoints=websecure
      - traefik.http.routers.voice.tls=true
      - traefik.http.services.voice.loadbalancer.server.port=8090

  # ---- video ----------------------------------------------------------------
  # quicvideod: camera + screen share for voice channels (docs/video.md). It
  # trusts only quicvoiced's video tickets (its JWKS) and takes membership
  # from quicvoiced over the control listener (8091, compose network only).
  # Run it on its own box instead with compose.video-node.yaml.
  quicvideod:
    <<: *restart
    profiles: [video]
    image: ${QUICVIDEO_IMAGE:-harbor.floret.dev/boson/quicvideo:1.15.1}
    ports:
      # QUIC for the apps and WebTransport (HTTP/3, /wt) for browsers.
      - "7710:7710/udp"
    environment:
      ENV: production
      QUIC_ADDR: ":7710"
      # Internal: /healthz, /version, /metrics. Never routed.
      HTTP_ADDR: ":8080"
      # /healthz and /v1/info, routed at https://VIDEO_HOST.
      PUBLIC_HTTP_ADDR: ":8090"
      CONTROL_HTTP_ADDR: ":8091"
      # Required (quicvideod won't start without it); scripts/setup.sh makes one.
      CONTROL_TOKEN: ${VIDEO_CONTROL_TOKEN:-}
      # Every video room is a voice channel: rooms voice doesn't list are
      # emptied when its membership snapshot arrives.
      VOICE_SYNC: "true"
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE: /certs/tls.key
      AUTH_JWKS_URL: ${VIDEO_TICKET_JWKS_URL:-http://quicvoiced:8090/.well-known/video-jwks.json}
      AUTH_ISSUER: voice
      AUTH_AUDIENCE: quicvideo
      ROOM_MAX_PARTICIPANTS: ${VIDEO_MAX_PARTICIPANTS:-20}
      # Browsers allowed to open WebTransport sessions: as quicvoiced,
      # default "directory" (this stack's WEB_HOST plus the directory's
      # verified Boson web clients, from auth's /v1/web-origins); * = any,
      # or comma-separated origins. A video node on its own box sets
      # VIDEO_ORIGINS_URL (compose.video-node.yaml).
      WEBTRANSPORT_ORIGINS: ${VIDEO_WEBTRANSPORT_ORIGINS:-directory${WEB_HOST:+,https://${WEB_HOST}}}
      ORIGINS_URL: ${VIDEO_ORIGINS_URL:-http://auth:8080/v1/web-origins}
    volumes:
      - certs_video:/certs:ro
    depends_on:
      certsync:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.routers.video.rule=Host(`${VIDEO_HOST:-video.invalid}`)
      - traefik.http.routers.video.entrypoints=websecure
      - traefik.http.routers.video.tls=true
      - traefik.http.routers.video.service=video
      - traefik.http.services.video.loadbalancer.server.port=8090

  # ---- metrics --------------------------------------------------------------
  victoriametrics:
    <<: *restart
    profiles: [metrics]
    image: victoriametrics/victoria-metrics:v1.131.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-90d}
      - -promscrape.config=/etc/vm/scrape.yml
      - -httpListenAddr=:8428
    volumes:
      - ./monitoring/scrape.yml:/etc/vm/scrape.yml:ro
      - vm_data:/storage
    # node-exporter (below) runs on the host network and listens only on the
    # stack network's gateway address; scrape.yml targets this name.
    extra_hosts:
      - host.docker.internal:${NODE_EXPORTER_ADDR:-10.203.53.1}
    # Internal only: the admin panel (and Grafana, if you add one) query
    # http://victoriametrics:8428. Not published on the host.

  # Host metrics (CPU, memory, load, disks, network, PSI) of the machine
  # running the stack, scraped as job "node". It has to see the HOST, not a
  # container: host PID namespace, the host's / read-only at /host, and the
  # host network namespace (network_mode: host) so netdev/netstat report the
  # host's interfaces.
  #
  # Host networking means it isn't on the stack network, so it is NOT bound to
  # 0.0.0.0: it listens on the stack network's gateway (the host's address on
  # the stack bridge, the first address of STACK_SUBNET; set
  # NODE_EXPORTER_ADDR when you change STACK_SUBNET). Only containers on the
  # stack network (victoriametrics) can route to it; nothing on the public
  # interface can. A host firewall that drops incoming traffic by default
  # (ufw) drops this too: install.sh adds the rule when ufw is active
  # (an existing install: get.boson.chat ... | sudo sh -s -- --firewall);
  # by hand:
  #   ufw allow from 10.203.53.0/24 to 10.203.53.1 port 9100 proto tcp comment 'boson: metrics -> node-exporter'
  node-exporter:
    <<: *restart
    profiles: [metrics]
    image: prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_ADDR:-10.203.53.1}:9100
      # Only what the admin panel's host view needs; the rest are off.
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.pressure
      - --collector.filesystem
      - --collector.diskstats
      - --collector.netdev
      - --collector.netstat
      - --collector.stat       # node_boot_time_seconds (uptime), context switches
      - --collector.time
      - --collector.uname
      - --collector.os
      # Real disks only: no container overlays, tmpfs, or Docker's own mounts.
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs|ramfs|fuse\..*)$$
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|snap|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --collector.netdev.device-exclude=^(lo|veth.*|br-.*|docker.*)$$
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://${NODE_EXPORTER_ADDR:-10.203.53.1}:9100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- admin (SLOT: upcoming admin panel, not released yet) -----------------
  # Off unless COMPOSE_PROFILES includes "admin". Image and env are the
  # planned contract; adjust when the first release ships.
  admin:
    <<: *restart
    profiles: [admin]
    image: ${ADMIN_IMAGE:-harbor.floret.dev/boson/admin:1.31.0}
    environment:
      ENV: production
      # The stack config file: the panel edits it (Settings pages, Config
      # file view) and reports each service's reload status from
      # CONFIG_STATUS_TARGETS (compose service name = internal status URL;
      # the panel reports its own). ergo:8098 is the boson-ergo helper's
      # status listener (compose network only, never published).
      BOSON_CONFIG: /config/boson.yaml
      CONFIG_STATUS_TARGETS: >-
        ${ADMIN_CONFIG_STATUS_TARGETS:-auth=http://auth:8081/internal/config/status,quicvoiced=http://quicvoiced:8080/internal/config/status,directory=http://directory:8081/internal/config/status,ergo=http://ergo:8098/internal/config/status,api=http://api:3001/internal/config/status,files=http://files:3001/internal/config/status}
      PUBLIC_URL: https://${ADMIN_HOST:-admin.${DOMAIN:-localhost}}
      # This install's domain: the Federation page checks
      # https://BOSON_DOMAIN/.well-known/boson.json (admin with
      # boson-chat/admin#34; older panels ignore it). The settings themselves
      # are auth.federation.* in config/boson.yaml (mounted rw below).
      BOSON_DOMAIN: ${DOMAIN:-}
      # Seals the admin's auth tokens in the session cookie (32 random bytes, base64).
      SESSION_KEY: ${ADMIN_SESSION_KEY:-}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      AUTH_URL: http://auth:8080
      AUTH_INTERNAL_URL: http://auth:8081
      METRICS_URL: ${ADMIN_METRICS_URL-http://victoriametrics:8428}
      EDGE_NAME: Traefik
      # IRC health (Ergo): set ADMIN_IRC_CHECK= (empty) without the irc profile.
      IRC_CHECK: ${ADMIN_IRC_CHECK-ircs://ergo:6697}
      IRC_CHECK_SERVER_NAME: ${IRC_HOST}
      GRAFANA_URL: ${GRAFANA_URL:-}
      # The Stack page shows the compose services that have a container
      # (through docker-proxy below), so a profile that's off isn't shown as
      # down. It has built-in health, version and public ("from you") probes
      # for auth, quicvoiced, quicvideod, IRC, api, directory, files, web,
      # webircgateway, victoriametrics and minio; the public ones use these
      # hostnames (empty = no probe).
      AUTH_HOST: ${AUTH_HOST:-}
      VOICE_HOST: ${VOICE_HOST:-}
      IRC_HOST: ${IRC_HOST:-}
      API_HOST: ${API_HOST:-}
      DIRECTORY_HOST: ${DIRECTORY_HOST:-}
      FILES_HOST: ${FILES_HOST:-}
      VIDEO_HOST: ${VIDEO_HOST:-}
      WEB_HOST: ${WEB_HOST:-}
      # name=url,... added to the built-in probes, or replacing them for that
      # name; with ADMIN_DOCKER_PROXY_URL= (empty) they are the whole list.
      HEALTH_TARGETS: ${ADMIN_HEALTH_TARGETS:-}
      VERSION_TARGETS: ${ADMIN_VERSION_TARGETS:-}
      PUBLIC_PROBE_TARGETS: ${ADMIN_PUBLIC_PROBES:-}
      # Certificates: every CERT_HOSTS hostname on 443 dialled at traefik,
      # IRC_HOST on 6697. ADMIN_TLS_CHECK_HOSTS (host:port[@dial-host:port])
      # replaces that list; config/boson.yaml admin.tls_check_hosts wins.
      CERT_HOSTS: ${CERT_HOSTS:-${IRC_HOST:-},${VOICE_HOST:-},${AUTH_HOST:-}}
      TLS_EDGE_ADDR: traefik:443
      TLS_CHECK_HOSTS: ${ADMIN_TLS_CHECK_HOSTS:-}
      # Services control (restart/stop/start, logs) through docker-proxy below.
      # Empty ADMIN_DOCKER_PROXY_URL= turns it off.
      DOCKER_PROXY_URL: ${ADMIN_DOCKER_PROXY_URL-http://docker-proxy:2375}
      DOCKER_PROJECT: ${STACK_PROJECT:-boson}
      # evrd-links: restarting it drops every Boson user off IRC.
      DOCKER_PROTECTED_SERVICES: admin,traefik,evrd-links
      # Users' boson profiles (avatar, handle) from the api
      # profile. Set ADMIN_BOSON_API_URL= (empty) without it.
      BOSON_API_URL: ${ADMIN_BOSON_API_URL-http://api:3000}
      # The api's internal listener: the Nick claims page (status, test
      # connection) and its config status. Empty without the api profile.
      BOSON_API_INTERNAL_URL: ${ADMIN_BOSON_API_INTERNAL_URL-http://api:3001}
      BOSON_API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-}
      # The directory this network is listed in (Directory page; network key
      # + DNS TXT proof). docs/directory.md.
      DIRECTORY_API_URL: ${ADMIN_DIRECTORY_API_URL-https://directory.boson.chat}
      # Default; config/boson.yaml admin.directory_registration wins (the
      # listed hostname: admin.directory_hostname, else IRC_CHECK_SERVER_NAME).
      DIRECTORY_REGISTRATION: ${ADMIN_DIRECTORY_REGISTRATION:-true}
      # The stack's own directory (directory profile): the "include the boson
      # main directory" switch, its peers, and users' listings. scripts/setup.sh
      # sets ADMIN_DIRECTORY_LOCAL_URL=http://directory:8080 with the profile.
      DIRECTORY_LOCAL_URL: ${ADMIN_DIRECTORY_LOCAL_URL:-}
      DIRECTORY_INTERNAL_TOKEN: ${DIRECTORY_INTERNAL_TOKEN:-}
      # The files service's internal listener (files profile): the Uploads
      # page's live status, moderation and users' usage. docs/files.md.
      # Empty ADMIN_FILES_INTERNAL_URL= without the profile.
      BOSON_FILES_INTERNAL_URL: ${ADMIN_FILES_INTERNAL_URL-http://files:3001}
      BOSON_FILES_INTERNAL_TOKEN: ${FILES_INTERNAL_TOKEN:-}
      # Updates page (docs/updates.md): newer releases of every part, their
      # changelogs and who an update affects. Applying them needs the
      # updates profile (docker-proxy-updates below) and
      # ADMIN_UPDATES_DOCKER_PROXY_URL=http://docker-proxy-updates:2375;
      # without it updates are shown, not applied.
      UPDATES_DOCKER_PROXY_URL: ${ADMIN_UPDATES_DOCKER_PROXY_URL:-}
      UPDATES_GITHUB_TOKEN: ${ADMIN_UPDATES_GITHUB_TOKEN:-}
      UPDATES_CHECK_INTERVAL: ${ADMIN_UPDATES_CHECK_INTERVAL:-6h}
      # Host directory for the backup taken before every update (.env,
      # config, image digests, database dumps, data volumes); the newest
      # ADMIN_UPDATES_BACKUP_KEEP are kept.
      UPDATES_BACKUP_DIR: ${ADMIN_UPDATES_BACKUP_DIR:-/root/backups/boson-updates}
      UPDATES_BACKUP_KEEP: ${ADMIN_UPDATES_BACKUP_KEEP:-5}
      # The update journal survives the panel's own restart (it updates
      # itself last and picks the run up again).
      UPDATES_STATE_DIR: /data
    volumes:
      # rw: the panel saves config/boson.yaml (temp file + rename in this dir)
      # and the Branding page's images in config/branding/.
      - ./config:/config
      - admin_data:/data
    networks: [default, docker-proxy]
    labels:
      - traefik.enable=true
      # Two networks: tell Traefik which one reaches the panel.
      - traefik.docker.network=${STACK_PROJECT:-boson}_default
      - traefik.http.routers.admin.rule=Host(`${ADMIN_HOST:-admin.${DOMAIN:-localhost}}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls=true
      - traefik.http.services.admin.loadbalancer.server.port=8080
    # Note: ADMIN_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on:
      auth:
        condition: service_started
      config-init:
        condition: service_completed_successfully
      admin-data-init:
        condition: service_completed_successfully

  # The panel's own data volume (the update journal), owned by its uid.
  admin-data-init:
    profiles: [admin]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 700 /data"]
    volumes:
      - admin_data:/data
    restart: "no"

  # The admin panel's only door to Docker: a socket proxy that allows listing
  # and inspecting containers, their logs and stats, and start/stop/restart,
  # nothing else (no exec, create, delete, images, volumes, events), and only
  # for the host named "admin". The panel itself never mounts the socket and
  # limits actions to this compose project.
  docker-proxy:
    <<: *restart
    profiles: [admin]
    image: wollomatic/socket-proxy:1.13.2
    # nobody + the host's docker group, so it can open the socket read/write
    # without root. scripts/setup.sh fills DOCKER_GID (getent group docker).
    user: "65534:${DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=admin
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))'
      - '-allowHEAD=(/v1\.[0-9]+)?/_ping'
      - '-allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]

  # Applying updates from the admin panel (opt-in: COMPOSE_PROFILES gets
  # "updates" and ADMIN_UPDATES_DOCKER_PROXY_URL=http://docker-proxy-updates:2375).
  # Everything docker-proxy allows, plus pulling images and creating and
  # removing containers: the panel runs each update step in a short-lived
  # docker:cli helper (label chat.boson.updates) with the Docker socket and
  # this directory mounted. That is root-equivalent access to the host,
  # which is why it is a separate proxy in its own profile. docs/updates.md.
  docker-proxy-updates:
    <<: *restart
    profiles: [updates]
    image: wollomatic/socket-proxy:1.13.2
    user: "65534:${DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=admin
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))'
      - '-allowHEAD=(/v1\.[0-9]+)?/_ping'
      - '-allowPOST=(/v1\.[0-9]+)?/(containers/[a-zA-Z0-9_.-]+/(start|stop|restart)|containers/create|images/create)'
      - '-allowDELETE=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]

  # ---- api (optional): the boson backend API --------------------------------
  # Profiles, nick claims and avatars for the boson client
  # (github.com/boson-chat/backend). Uses the stack Postgres and the
  # auth service. Nick claims (docs/nick-claim.md) are off unless
  # config/boson.yaml nick_claim.enabled (or NICK_CLAIM_ENABLED) says so;
  # R2_* (avatars) is optional: empty disables it. See docs/api.md.
  api:
    <<: *restart
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.57.3}
    command: ["serve"]
    environment: &api-env
      PORT: "3000"
      ENV: production
      # Pages allowed to call the API from a browser (CORS). Default
      # "directory" (the web clients of the Boson servers verified in the
      # directory auth follows, from auth's /v1/web-origins: federated
      # sessions on those call their home API here with its bearer token)
      # plus https://DOMAIN and https://WEB_HOST, which stay allowed when
      # auth is down. Or comma-separated origins. backend images before the
      # directory mode ignore the "directory" entry (fixed origins only).
      ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-directory,https://${DOMAIN:-localhost}${WEB_HOST:+,https://${WEB_HOST}}}
      ORIGINS_URL: ${API_ORIGINS_URL:-http://auth:8080/v1/web-origins}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: boson
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${API_DB_NAME:-api}
      DBUSERNAME: ${API_DB_USER:-api}
      DBPASSWORD: ${API_DB_PASSWORD:-}
      DBSSLMODE: disable
      # config/boson.yaml (nick_claim:) wins over the env defaults below.
      BOSON_CONFIG: /config/boson.yaml
      # Internal listener (compose network only, never routed by Traefik):
      # /internal/config/status and the admin panel's nick-claim endpoints
      # (status, test connection). Calls need API_INTERNAL_TOKEN.
      INTERNAL_PORT: "3001"
      INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-}
      # Nick claims (docs/nick-claim.md): DEFAULTS only, config/boson.yaml
      # nick_claim.enabled / email_domain / rate_limit_per_hour / inbound.*
      # win. Off unless one of them turns it on.
      NICK_CLAIM_ENABLED: ${NICK_CLAIM_ENABLED:-false}
      NICK_CLAIM_EMAIL_DOMAIN: ${NICK_CLAIM_EMAIL_DOMAIN:-${DOMAIN:-}}
      NICK_CLAIM_RATE_LIMIT_PER_HOUR: ${NICK_CLAIM_RATE_LIMIT_PER_HOUR:-5}
      # The inbound mailbox's password is a secret: it stays in .env.
      NICK_CLAIM_POP3_PASSWORD: ${NICK_CLAIM_POP3_PASSWORD:-${POP3_PASSWORD:-}}
      # Older env names, still read as defaults (nick_claim.inbound.* wins).
      PURELYMAIL_POP3_HOST: ${POP3_HOST:-}
      PURELYMAIL_POP3_PORT: ${POP3_PORT:-995}
      PURELYMAIL_POP3_USER: ${POP3_USER:-}
      PURELYMAIL_POP3_TLS: ${POP3_TLS:-true}
      PURELYMAIL_POP3_PASSWORD: ${NICK_CLAIM_POP3_PASSWORD:-${POP3_PASSWORD:-}}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${R2_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${R2_BUCKET:-}
      CLOUDFLARE_CDN_BASE_URL: ${CDN_BASE_URL:-}
      # Link previews for the web client (GET /v1/unfurl, backend >= 0.57.0;
      # docs/api.md): the API fetches public pages through an SSRF guard.
      # Client addresses (for the per-address limit) come from Traefik's
      # X-Forwarded-For.
      UNFURL_ENABLED: ${API_UNFURL_ENABLED:-true}
      UNFURL_RATE_PER_IP: ${API_UNFURL_RATE_PER_IP:-120}
      UNFURL_RATE_PER_USER: ${API_UNFURL_RATE_PER_USER:-60}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST:-api.${DOMAIN:-localhost}}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000
    volumes:
      - ./config:/config:ro
    # Note: API_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully

  # Applies the API's database migrations before it starts (exits when done).
  api-migrate:
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.57.3}
    command: ["migrate", "up"]
    environment: *api-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- directory (optional): a boson network directory -------------------------
  # github.com/boson-chat/directory: the IRC network directory the boson app
  # browses (directory.boson.chat is one). Website + /v1 API at DIRECTORY_HOST,
  # own database in the stack Postgres (needs the auth profile), media in the
  # directory_media volume. Includes directory.boson.chat's listings by default
  # (DIRECTORY_INCLUDE_MAIN), each re-checked against its own DNS. The image
  # applies its migrations at start. See docs/directory.md.
  directory-media-init:
    profiles: [directory]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /media && chmod 750 /media"]
    volumes:
      - directory_media:/media
    restart: "no"

  directory:
    <<: *restart
    profiles: [directory]
    image: ${DIRECTORY_IMAGE:-harbor.floret.dev/boson/directory:1.10.0}
    environment:
      ENV: ${DIRECTORY_ENV:-production}
      LOG_LEVEL: ${DIRECTORY_LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${DIRECTORY_DB_USER:-directory}:${DIRECTORY_DB_PASSWORD:-}@postgres:5432/${DIRECTORY_DB_NAME:-directory}?sslmode=disable
      # Owners sign in with this stack's accounts (bearer tokens via JWKS,
      # the browser cookie flow at AUTH_HOST).
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_PUBLIC_URL: https://${AUTH_HOST}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      # config/boson.yaml (directory:) wins over the env defaults below.
      BOSON_CONFIG: /config/boson.yaml
      # /.well-known/boson-directory.json: name, operator, contact. These and
      # the federation values below are defaults only: config/boson.yaml
      # directory.name / operator / contact / include_main / main_peer_url /
      # sync_every / peers win (the admin panel's Directory page writes them
      # there; without BOSON_CONFIG it stores them in the directory's
      # database, directory >= 1.4.0).
      DIRECTORY_NAME: ${DIRECTORY_NAME:-${NETWORK_NAME:-Boson} directory}
      DIRECTORY_PUBLIC_URL: https://${DIRECTORY_HOST:-directory.${DOMAIN:-localhost}}
      # Owner calls (listing edits) from the web client; public GETs are * anyway.
      CORS_ALLOWED_ORIGINS: ${DIRECTORY_CORS_ALLOWED_ORIGINS:-${WEB_HOST:+https://${WEB_HOST}}}
      DIRECTORY_OPERATOR: ${NETWORK_NAME:-Boson}
      DIRECTORY_CONTACT: ${DIRECTORY_CONTACT:-${ADMIN_EMAIL:-}}
      # Federation: other directories to seed once (comma-separated URLs) and
      # the built-in main peer, on unless DIRECTORY_INCLUDE_MAIN=false. Add or
      # remove peers and switch the main directory at runtime in the admin
      # panel (Directory page) or the directory's own Peers page.
      DIRECTORY_PEERS: ${DIRECTORY_PEERS:-}
      DIRECTORY_MAIN_PEER: ${DIRECTORY_MAIN_PEER:-https://directory.boson.chat}
      DIRECTORY_INCLUDE_MAIN: ${DIRECTORY_INCLUDE_MAIN:-true}
      # Operator API token (X-Internal-Token) for the admin panel.
      DIRECTORY_INTERNAL_TOKEN: ${DIRECTORY_INTERNAL_TOKEN:-}
      # Icons and banners (local volume; S3/R2 optional, see the directory's docs).
      MEDIA_DIR: /media
      # Empty = real DNS (three public resolvers). "fake" = every TXT check
      # passes; only honoured with DIRECTORY_ENV=development (CI).
      DNS_VERIFIER: ${DIRECTORY_DNS_VERIFIER:-}
    volumes:
      - directory_media:/media
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      directory-media-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.directory.rule=Host(`${DIRECTORY_HOST:-directory.${DOMAIN:-localhost}}`)
      - traefik.http.routers.directory.entrypoints=websecure
      - traefik.http.routers.directory.tls=true
      - traefik.http.services.directory.loadbalancer.server.port=8080
    # Note: DIRECTORY_HOST must be in CERT_HOSTS so Traefik gets its
    # certificate. The legacy https://API_HOST/servers route is in
    # traefik/dynamic/directory.yml (DIRECTORY_SERVES_LEGACY).

  # ---- files (optional): uploads with a rolling quota --------------------------
  # github.com/boson-chat/files: users (and guests) upload files the boson
  # client links in chat. Public API + downloads at https://FILES_HOST (its
  # own host, never the app's or auth's origin); internal listener :3001
  # (X-Internal-Token: the admin panel), never routed. Own database in the
  # stack Postgres (needs the auth profile), files in the files_data volume
  # (storage.driver: local) or any S3-compatible bucket (s3; see the minio
  # profile). Settings: config/boson.yaml files: (the admin panel's Uploads
  # page). Off unless files.enabled (or FILES_ENABLED). See docs/files.md.
  files-data-init:
    profiles: [files]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 750 /data"]
    volumes:
      - files_data:/data
    restart: "no"

  files:
    <<: *restart
    profiles: [files]
    image: ${FILES_IMAGE:-harbor.floret.dev/boson/files:1.1.1}
    environment:
      ENV: ${FILES_ENV:-production}
      LOG_LEVEL: ${FILES_LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      INTERNAL_ADDR: ":3001"
      FILES_PUBLIC_URL: https://${FILES_HOST:-files.${DOMAIN:-localhost}}
      # The admin panel's calls (X-Internal-Token on :3001).
      INTERNAL_TOKEN: ${FILES_INTERNAL_TOKEN:-}
      # Signs guest upload tokens (POST /v1/guest-token), 16+ characters.
      # Empty: guests are off.
      FILES_GUEST_SECRET: ${FILES_GUEST_SECRET:-}
      FILES_GUEST_TOKENS_PER_HOUR: ${FILES_GUEST_TOKENS_PER_HOUR:-10}
      # How long one upload may take to send its body (Traefik's
      # TRAEFIK_READ_TIMEOUT must be longer).
      FILES_UPLOAD_TIMEOUT: ${FILES_UPLOAD_TIMEOUT:-30m}
      # config/boson.yaml (files:) wins over the env defaults.
      BOSON_CONFIG: /config/boson.yaml
      # Default; config/boson.yaml files.enabled wins.
      FILES_ENABLED: ${FILES_ENABLED:-false}
      # Accounts: the stack's auth access tokens, checked against its JWKS.
      # The JWKS URL is set explicitly: the default ($AUTH_ISSUER/.well-known/
      # jwks.json) is the public host, which doesn't resolve in the network.
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      DATABASE_URL: postgres://${FILES_DB_USER:-files}:${FILES_DB_PASSWORD:-}@postgres:5432/${FILES_DB_NAME:-files}?sslmode=disable
      # storage.driver: local
      FILES_DATA_DIR: /data
      # storage.driver: s3. Secrets: only here, never in the file. With the
      # minio profile these are the bucket-only user minio-init creates.
      FILES_S3_ACCESS_KEY: ${FILES_S3_ACCESS_KEY:-}
      FILES_S3_SECRET_KEY: ${FILES_S3_SECRET_KEY:-}
      # Client IPs (guest quotas, rate limits) from Traefik's X-Forwarded-For.
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      # Pages allowed to call the upload API from a browser (federated users
      # upload here from their home install's web client): as quicvoiced,
      # default "directory" (WEB_HOST plus the directory's verified Boson
      # web clients); * = any, or comma-separated origins. Downloads (/f/)
      # stay open to any page. files images before the directory mode
      # ignore it (any page).
      CORS_ALLOWED_ORIGINS: ${FILES_CORS_ALLOWED_ORIGINS:-directory${WEB_HOST:+,https://${WEB_HOST}}}
      ORIGINS_URL: ${FILES_ORIGINS_URL:-http://auth:8080/v1/web-origins}
    # Distroless (uid 65532, no shell or curl): no healthcheck; /healthz and
    # /readyz are on :3001 for the admin panel.
    volumes:
      - files_data:/data
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      files-data-init:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.files.rule=Host(`${FILES_HOST:-files.${DOMAIN:-localhost}}`)
      - traefik.http.routers.files.entrypoints=websecure
      - traefik.http.routers.files.tls=true
      # Public listener only; :3001 (internal API, /metrics) is never routed.
      - traefik.http.services.files.loadbalancer.server.port=8080
    # Note: FILES_HOST must be in CERT_HOSTS so Traefik gets its certificate.

  # ---- pushrelay (optional; boson.chat only): phone push ----------------------
  # github.com/boson-chat/pushrelay (docs/push.md §2, "Running the relay"): a
  # Web Push endpoint for the official Boson apps. Installs' Ergo POSTs
  # encrypted, VAPID-signed pushes to https://PUSH_HOST/v1/push/<mailbox>; the
  # relay forwards them to APNs / FCM with the app's keys. Every install uses
  # boson.chat's (boson.json "push.relay"), so only boson.chat (or a
  # third-party app build) runs this. Needs the auth profile (Postgres: one
  # table of mailboxes). Public API at PUSH_HOST (add it to CERT_HOSTS);
  # operator API and /metrics on :3001, never routed.
  # Secrets (APNs .p8 key, Firebase service account) are files in
  # PUSHRELAY_SECRETS_DIR, mounted read-only; never put them in .env.
  pushrelay:
    <<: *restart
    profiles: [pushrelay]
    # Placeholder version until the first release is on Harbor.
    image: ${PUSHRELAY_IMAGE:-harbor.floret.dev/boson/pushrelay:1.1.0}
    environment:
      LOG_LEVEL: ${PUSHRELAY_LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      INTERNAL_ADDR: ":3001"
      # The relay's origin: the VAPID JWT "aud" installs must sign for, and
      # the base of the mailbox endpoints it hands out.
      PUSHRELAY_PUBLIC_URL: https://${PUSH_HOST:-push.${DOMAIN:-localhost}}
      DATABASE_URL: postgres://${PUSHRELAY_DB_USER:-pushrelay}:${PUSHRELAY_DB_PASSWORD:-}@postgres:5432/${PUSHRELAY_DB_NAME:-pushrelay}?sslmode=disable
      # Operator API (X-Internal-Token on :3001): block an install, delete a
      # mailbox, per-install counts.
      PUSHRELAY_INTERNAL_TOKEN: ${PUSHRELAY_INTERNAL_TOKEN:-}
      # Client IPs (per-IP mailbox creation limit) from Traefik's X-Forwarded-For.
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      # APNs (token auth): the .p8 key file, its key id, the Apple team id and
      # the app's bundle id (apns-topic).
      PUSHRELAY_APNS_KEY_FILE: ${PUSHRELAY_APNS_KEY_FILE:-/run/secrets/pushrelay/apns.p8}
      PUSHRELAY_APNS_KEY_ID: ${PUSHRELAY_APNS_KEY_ID:-}
      PUSHRELAY_APNS_TEAM_ID: ${PUSHRELAY_APNS_TEAM_ID:-}
      PUSHRELAY_APNS_TOPIC: ${PUSHRELAY_APNS_TOPIC:-chat.boson.app}
      # FCM HTTP v1: Google credentials JSON, a service-account key or (no
      # key, pushrelay >= the release with external_account support) a
      # Workload Identity Federation credential configuration whose token
      # url is auth's internal http://auth:8081/internal/v1/workload/token
      # (docs/push.md "FCM without a Google key"). The project id comes
      # from the key file, else PUSHRELAY_FCM_PROJECT_ID (required for the
      # keyless file). PUSHRELAY_WORKLOAD_TOKEN_FILE: the secret the relay
      # sends to auth's workload endpoint (= PUSHRELAY_WORKLOAD_TOKEN), used
      # when the file exists.
      PUSHRELAY_FCM_CREDENTIALS_FILE: ${PUSHRELAY_FCM_CREDENTIALS_FILE:-/run/secrets/pushrelay/fcm.json}
      PUSHRELAY_FCM_PROJECT_ID: ${PUSHRELAY_FCM_PROJECT_ID:-}
      PUSHRELAY_WORKLOAD_TOKEN_FILE: ${PUSHRELAY_WORKLOAD_TOKEN_FILE:-/run/secrets/pushrelay/workload-token}
      # App Attest (iOS): the app id (TEAMID.bundle id; empty = derived from
      # the two above) and which attestations count: production, or
      # development for dev-signed builds.
      PUSHRELAY_APP_ATTEST_APP_ID: ${PUSHRELAY_APP_ATTEST_APP_ID:-}
      PUSHRELAY_APP_ATTEST_ENV: ${PUSHRELAY_APP_ATTEST_ENV:-production}
      # Play Integrity (Android): package name, release signing certificate
      # SHA-256 digests (comma-separated) and a service account allowed to
      # decode integrity tokens (empty = the FCM one).
      PUSHRELAY_PLAY_INTEGRITY_PACKAGE: ${PUSHRELAY_PLAY_INTEGRITY_PACKAGE:-chat.boson.app}
      PUSHRELAY_PLAY_INTEGRITY_CERT_SHA256: ${PUSHRELAY_PLAY_INTEGRITY_CERT_SHA256:-}
      PUSHRELAY_PLAY_INTEGRITY_CREDENTIALS_FILE: ${PUSHRELAY_PLAY_INTEGRITY_CREDENTIALS_FILE:-}
      # Development builds (apns-sandbox): allowed without attestation only
      # if listed in this file. Empty = sandbox mailboxes are refused.
      PUSHRELAY_DEV_ALLOWLIST_FILE: ${PUSHRELAY_DEV_ALLOWLIST_FILE:-}
      # Abuse limits (docs/push.md §2.4). Per mailbox: a burst, then one push
      # per interval, and a daily cap; per install domain: an hourly ceiling
      # (429 above it); per IP: mailboxes created per hour.
      PUSHRELAY_MAILBOX_BURST: ${PUSHRELAY_MAILBOX_BURST:-10}
      PUSHRELAY_MAILBOX_INTERVAL: ${PUSHRELAY_MAILBOX_INTERVAL:-6s}
      PUSHRELAY_MAILBOX_PER_DAY: ${PUSHRELAY_MAILBOX_PER_DAY:-300}
      PUSHRELAY_INSTALL_PER_HOUR: ${PUSHRELAY_INSTALL_PER_HOUR:-10000}
      PUSHRELAY_CREATE_PER_IP_PER_HOUR: ${PUSHRELAY_CREATE_PER_IP_PER_HOUR:-20}
      # Mailboxes unused this long are deleted.
      PUSHRELAY_MAILBOX_IDLE_DAYS: ${PUSHRELAY_MAILBOX_IDLE_DAYS:-60}
    volumes:
      # apns.p8, fcm.json, workload-token (and the optional files above). Readable by the
      # relay's user (uid 65532): docs/push.md "Running the relay".
      - ${PUSHRELAY_SECRETS_DIR:-./secrets/pushrelay}:/run/secrets/pushrelay:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.pushrelay.rule=Host(`${PUSH_HOST:-push.${DOMAIN:-localhost}}`)
      - traefik.http.routers.pushrelay.entrypoints=websecure
      - traefik.http.routers.pushrelay.tls=true
      # Public listener only; :3001 (operator API, /metrics) is never routed.
      - traefik.http.services.pushrelay.loadbalancer.server.port=8080
    # Note: PUSH_HOST must be in CERT_HOSTS so Traefik gets its certificate.

  # ---- minio (optional): an S3-compatible bucket for files ---------------------
  # For files with storage.driver: s3 on this host. Internal only: the S3 API
  # (9000) isn't published or routed and the web console is off; files
  # proxies every download through /f/. Upstream MinIO no longer publishes
  # images: this is Bitnami's last build (bitnamilegacy). It creates the
  # bucket itself (MINIO_DEFAULT_BUCKETS). Then in config/boson.yaml:
  # files.storage: { driver: s3, capacity: 15GB, s3: { endpoint:
  # "http://minio:9000", bucket: boson-files, region: auto, path_style: true } }.
  # docs/files.md.
  minio:
    <<: *restart
    profiles: [minio]
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    # Refuses to start without root credentials (the image would fall back
    # to minio/miniosecret). Checked here, not with ${VAR:?}, so installs
    # without the profile don't need them.
    entrypoint: ["sh", "-ec"]
    command:
      - |
        if [ -z "$$MINIO_ROOT_USER" ] || [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "minio: set MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in .env (scripts/setup.sh)" >&2
          exit 1
        fi
        exec /opt/bitnami/scripts/minio/entrypoint.sh /opt/bitnami/scripts/minio/run.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_DEFAULT_BUCKETS: ${FILES_S3_BUCKET:-boson-files}
      # The web console: off (to use it: MINIO_BROWSER=on and an SSH tunnel
      # to port 9001, docs/files.md).
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    # Sized for a 2 GB VPS.
    mem_limit: ${MINIO_MEM_LIMIT:-320m}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The files service's own user (FILES_S3_ACCESS_KEY / FILES_S3_SECRET_KEY)
  # with a policy limited to its bucket, then exits. Idempotent: safe on
  # every `up`; a changed secret key is applied. (The image has no cat or
  # grep: shell builtins only.)
  minio-init:
    profiles: [minio]
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    entrypoint: ["sh", "-ec"]
    command:
      - |
        if [ -z "$$FILES_S3_ACCESS_KEY" ] || [ -z "$$FILES_S3_SECRET_KEY" ]; then
          echo "minio-init: set FILES_S3_ACCESS_KEY and FILES_S3_SECRET_KEY in .env (scripts/setup.sh)" >&2
          exit 1
        fi
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::'"$$BUCKET"'"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::'"$$BUCKET"'/*"]}]}' > /tmp/policy.json
        mc admin policy create local boson-files /tmp/policy.json
        mc admin user add local "$$FILES_S3_ACCESS_KEY" "$$FILES_S3_SECRET_KEY"
        case "$$(mc admin policy entities local --user "$$FILES_S3_ACCESS_KEY")" in
        *boson-files*) echo "policy already attached" ;;
        *) mc admin policy attach local boson-files --user "$$FILES_S3_ACCESS_KEY" ;;
        esac
        echo "minio-init: bucket $$BUCKET, user $$FILES_S3_ACCESS_KEY (policy boson-files)"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BUCKET: ${FILES_S3_BUCKET:-boson-files}
      FILES_S3_ACCESS_KEY: ${FILES_S3_ACCESS_KEY:-}
      FILES_S3_SECRET_KEY: ${FILES_S3_SECRET_KEY:-}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ---- webroot (optional) ---------------------------------------------------
  # Serves WEBROOT_DIR at http://WEBROOT_HOST/.well-known/acme-challenge/ for
  # a certbot (webroot mode) on this host that manages a cert outside the
  # stack. Don't list WEBROOT_HOST in CERT_HOSTS. See docs/deploy-boson-chat.md.
  webroot:
    <<: *restart
    profiles: [webroot]
    image: busybox:1.37.0
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ${WEBROOT_DIR:-/var/www/certbot}:/srv:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.webroot.rule=Host(`${WEBROOT_HOST:-}`) && PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.webroot.entrypoints=web
      - traefik.http.services.webroot.loadbalancer.server.port=8080

  # ---- wellknown (optional) -------------------------------------------------
  # Serves https://DOMAIN/.well-known/boson.json, which the boson client reads
  # to find this server's IRC, auth, voice, files and web client from just the
  # domain, and (with auth) the network's branding: https://AUTH_HOST/v1/branding.
  # Only for installs where DOMAIN itself points at this server; add DOMAIN to
  # CERT_HOSTS. Generated from .env at every start (images/wellknown/serve.sh).
  wellknown:
    <<: *restart
    profiles: [wellknown]
    image: busybox:1.37.0
    command: ["sh", "/serve.sh"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /run:uid=65534,gid=65534,size=1m
    environment:
      # Sections to publish (irc, auth, voice, files, web). Default: whichever of those
      # profiles are on. Set it when a part runs elsewhere (e.g. legacy IRC).
      WELLKNOWN_SECTIONS: ${WELLKNOWN_SECTIONS:-${COMPOSE_PROFILES:-}}
      IRC_HOST: ${IRC_HOST}
      # "web": {"url": "https://WEB_HOST"}: other installs accept this web
      # client's calls when this server is verified in their directory.
      WEB_HOST: ${WEB_HOST:-}
      AUTH_HOST: ${AUTH_HOST}
      VOICE_HOST: ${VOICE_HOST}
      FILES_HOST: ${FILES_HOST:-files.${DOMAIN:-localhost}}
      # With the irc section: "push": {"version": 1, "relay": PUSH_RELAY_URL},
      # the relay the phone apps use for this install (docs/push.md). Empty =
      # no relay (phone push off; browser push still works).
      PUSH_RELAY_URL: ${PUSH_RELAY_URL-https://push.boson.chat}
      # The "federation" section (docs/federation.md): auth's metadata,
      # fetched inside the network and refreshed every
      # WELLKNOWN_REFRESH_SECONDS ("accepts" follows the admin setting).
      # Only with the auth section; empty = no federation section.
      WELLKNOWN_FEDERATION_URL: ${WELLKNOWN_FEDERATION_URL-http://auth:8080/.well-known/boson-federation.json}
      WELLKNOWN_REFRESH_SECONDS: ${WELLKNOWN_REFRESH_SECONDS:-60}
    volumes:
      - ./images/wellknown/serve.sh:/serve.sh:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.wellknown.rule=Host(`${DOMAIN:-localhost}`) && Path(`/.well-known/boson.json`)
      - traefik.http.routers.wellknown.entrypoints=websecure
      - traefik.http.routers.wellknown.tls=true
      - traefik.http.routers.wellknown.middlewares=wellknown-headers
      - traefik.http.middlewares.wellknown-headers.headers.customresponseheaders.Access-Control-Allow-Origin=*
      - traefik.http.middlewares.wellknown-headers.headers.customresponseheaders.Cache-Control=public, max-age=300
      - traefik.http.services.wellknown.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/.well-known/boson.json"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---- web ------------------------------------------------------------------
  # The web client (docs/web.md): Boson in the browser at https://WEB_HOST,
  # the same app as the desktop one (harbor.floret.dev/boson/web, from
  # boson-chat/boson infra/web). Static files behind Traefik; its IRC goes
  # through webircgateway below (/webirc/websocket/ on the same host), its
  # calls over WebTransport to quicvoiced/quicvideod. WEB_HOST goes in
  # CERT_HOSTS.
  web:
    <<: *restart
    profiles: [web]
    image: ${WEB_IMAGE:-harbor.floret.dev/boson/web:0.104.0}
    environment:
      BOSON_AUTH_URL: https://${AUTH_HOST:-auth.invalid}
      BOSON_API_URL: ${WEB_API_URL:-https://${API_HOST:-api.${DOMAIN:-localhost}}}
      # The network directory the app browses (default the main one).
      BOSON_DIRECTORY_URL: ${WEB_DIRECTORY_URL:-https://directory.boson.chat}
      # Empty: this host's /webirc/websocket/ (the gateway below).
      BOSON_GATEWAY_URL: ${WEB_GATEWAY_URL:-}
      # The network this client is the home of, shown by name (web image
      # with networkName/networkDomain in /boson-config.js; older images
      # ignore both). Empty name: the name the auth service gives. Empty
      # domain: from AUTH_HOST (auth.example.com -> example.com).
      BOSON_NETWORK_NAME: ${NETWORK_NAME:-}
      BOSON_NETWORK_DOMAIN: ${WEB_NETWORK_DOMAIN:-}
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${WEB_HOST:-web.invalid}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls=true
      - traefik.http.services.web.loadbalancer.server.port=8080

  # webircgateway (docs/web.md): the browser client's IRC connections,
  # WebSocket in (wss://WEB_HOST/webirc/websocket/), TCP/TLS out to any IRC
  # network, with WEBIRC to the networks that trust it. IRC ports only, no
  # internal addresses (except the aliases below), per-IP caps.
  webircgateway:
    <<: *restart
    profiles: [web]
    build: images/webircgateway
    image: harbor.floret.dev/boson/stack-webircgateway:1.1.0-boson.2
    environment:
      WEBIRC_ORIGINS: ${WEBIRC_ORIGINS:-https://${WEB_HOST:-web.invalid}}
      WEBIRC_TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      # This network's own Ergo: on the compose network, plaintext services
      # listener, with WEBIRC.
      WEBIRC_ALIASES: ${WEBIRC_ALIASES:-${IRC_HOST:-irc.invalid}:6697=ergo:6680,${IRC_HOST:-irc.invalid}:6667=ergo:6680}
      WEBIRC_PASSWORDS: ${WEBIRC_PASSWORDS:-ergo=${WEBIRC_PASSWORD:-}}
      WEBIRC_EXTRA_PORTS: ${WEBIRC_EXTRA_PORTS:-}
      WEBIRC_UPSTREAM_ALLOW: ${WEBIRC_UPSTREAM_ALLOW:-}
      WEBIRC_UPSTREAM_DENY: ${WEBIRC_UPSTREAM_DENY:-}
      WEBIRC_MAX_PER_IP: ${WEBIRC_MAX_PER_IP:-30}
      WEBIRC_RATE_PER_MIN: ${WEBIRC_RATE_PER_MIN:-60}
      WEBIRC_THROTTLE: ${WEBIRC_THROTTLE:-4}
      WEBIRC_THROTTLE_BURST: ${WEBIRC_THROTTLE_BURST:-20}
      WEBIRC_LOG_LEVEL: ${WEBIRC_LOG_LEVEL:-2}
    read_only: true
    tmpfs:
      - /etc/webircgateway:uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      # /webirc/info (name and version) is public too: the admin Stack
      # page's "from you" probe. Nothing else of the gateway's is routed.
      - traefik.http.routers.webircgateway.rule=Host(`${WEB_HOST:-web.invalid}`) && (PathPrefix(`/webirc/websocket/`) || Path(`/webirc/info`))
      - traefik.http.routers.webircgateway.entrypoints=websecure
      - traefik.http.routers.webircgateway.tls=true
      - traefik.http.services.webircgateway.loadbalancer.server.port=8080

volumes:
  traefik_acme:
  certs_irc:
  certs_voice:
  certs_video:
  certs_bridge:
  bridge_links:
  bridge_data:
  ergo_db:
  roleserv_data:
  voice_data:
  pg_data:
  vm_data:
  directory_media:
  files_data:
  minio_data:
  admin_data:
