# boson stack: Traefik (TLS + routing), Ergo (IRC), auth + Postgres
# (accounts), quicvoiced (voice), VictoriaMetrics (metrics).
# Configure in .env (see .env.example / scripts/setup.sh), then:
#   docker compose up -d --build
# Which parts run is chosen by COMPOSE_PROFILES in .env
# (irc, voice, auth, api, directory, metrics, admin, webroot, wellknown). traefik and
# certsync always run.
# Install-specific additions: traefik/dynamic/*.yml and compose.override.yaml.
name: boson

x-restart: &restart
  restart: unless-stopped

networks:
  default:
    # Fixed subnet so the auth service (TRUSTED_PROXIES) and Ergo
    # (proxy-allowed-from) can trust X-Forwarded-For from Traefik.
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.203.53.0/24}
  # Only the admin panel and the Docker socket proxy are on it; internal, so
  # it has no route out.
  docker-proxy:
    internal: true

services:
  traefik:
    <<: *restart
    image: traefik:v3.7.19
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --log.nocolor=true
      - --ping=true
      - --metrics.prometheus=true
      # Only this compose project's containers, and only those with traefik.enable=true.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`boson`)
      # traefik/dynamic: the stack's cert routers (stack.yml) + your own files.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Everything on :80 redirects to https, except ACME HTTP-01 challenges.
      # allowACMEByPass also lets a more specific router (e.g. the webroot
      # profile) answer challenges for a host whose cert Traefik doesn't manage.
      - --entrypoints.web.allowacmebypass=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Drop headers like X_Forwarded_For that alias the ones Traefik sets.
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --certificatesresolvers.le.acme.email=${TLS_ISSUER:?set TLS_ISSUER in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.keytype=${ACME_KEY_TYPE:-EC256}
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    environment:
      # Read by traefik/dynamic/stack.yml.
      CERT_HOSTS: ${CERT_HOSTS:-${IRC_HOST:?set IRC_HOST in .env},${VOICE_HOST:?set VOICE_HOST in .env},${AUTH_HOST:?set AUTH_HOST in .env}}
      TLS_ISSUER: ${TLS_ISSUER}
      # Read by traefik/dynamic/directory.yml: true = the directory profile
      # answers https://API_HOST/servers* (the old api directory's paths).
      DIRECTORY_SERVES_LEGACY: ${DIRECTORY_SERVES_LEGACY:-false}
      API_HOST: ${API_HOST:-api.${DOMAIN:-localhost}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./local-certs:/local-certs:ro
      - traefik_acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  certsync:
    <<: *restart
    build: images/certsync
    image: harbor.floret.dev/boson/stack-certsync:latest
    environment:
      TLS_ISSUER: ${TLS_ISSUER}
      ACME_JSON: /acme/acme.json
      CERTSYNC_TARGETS: >-
        ${IRC_HOST}:/certs/irc:10000:fullchain.pem:privkey.pem
        ${VOICE_HOST}:/certs/voice:65532:tls.crt:tls.key
    volumes:
      - traefik_acme:/acme:ro
      - ./local-certs:/local-certs:ro
      - certs_irc:/certs/irc
      - certs_voice:/certs/voice
    depends_on: [traefik]

  # ---- irc ------------------------------------------------------------------
  ergo:
    <<: *restart
    profiles: [irc]
    build: images/ergo
    image: harbor.floret.dev/boson/stack-ergo:2.19.1
    ports:
      - "6697:6697"
      - "${IRC_PLAINTEXT_PORT:-127.0.0.1:6667}:6667"
    environment:
      IRC_HOST: ${IRC_HOST}
      DOMAIN: ${DOMAIN:-}
      NETWORK_NAME: ${NETWORK_NAME:-Boson}
      AUTH_HOST: ${AUTH_HOST}
      OPER_NAME: ${OPER_NAME:-admin}
      OPER_PASSWORD_HASH: ${OPER_PASSWORD_HASH:-}
      IRC_PLAINTEXT: ${IRC_PLAINTEXT:-false}
      IRC_WEBSOCKET: ${IRC_WEBSOCKET:-true}
      IRC_WEBSOCKET_ORIGINS: ${IRC_WEBSOCKET_ORIGINS:-}
      IRC_OAUTHBEARER: ${IRC_OAUTHBEARER:-true}
      IRC_PERSISTENT_HISTORY: ${IRC_PERSISTENT_HISTORY:-true}
      STACK_SUBNET: ${STACK_SUBNET:-10.203.53.0/24}
      # auth-script → auth service (internal listener, never published)
      AUTH_VERIFY_URL: http://auth:8081/internal/v1/verify-password
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # Text channel creation follows the auth service's channel_creation
      # setting (registered | admins), polled every SETTINGS_POLL_SECONDS;
      # a change re-renders ircd.yaml and rehashes Ergo. IRC_CHANNEL_CREATION
      # is used until auth answers the first time. See docs/irc-channels.md.
      AUTH_SETTINGS_URL: http://auth:8081/internal/v1/settings
      IRC_CHANNEL_CREATION: ${IRC_CHANNEL_CREATION:-registered}
      SETTINGS_POLL_SECONDS: ${SETTINGS_POLL_SECONDS:-30}
      # true = every IRC client must log in (no guests).
      IRC_REQUIRE_SASL: ${IRC_REQUIRE_SASL:-false}
      # Ergo's HTTP API on :8089 for quicvoiced (founder checks, channel
      # roles), RoleServ and the role sync. Compose network only: not
      # published, not routed. Empty = off.
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      # Network roles (docs/roles.md): oper classes from auth's roles, polled
      # every ROLES_POLL_SECONDS; members' oper class / WHOIS line / vhost
      # are applied at login and pushed to connected users on a change.
      IRC_ROLES: ${IRC_ROLES:-true}
      ROLES_POLL_SECONDS: ${ROLES_POLL_SECONDS:-10}
      IRC_ROLE_BASE_CAPABILITIES: ${IRC_ROLE_BASE_CAPABILITIES:-nofakelag}
      AUTH_INTERNAL_URL: http://auth:8081
      AUTH_PUBLIC_URL: http://auth:8080
      ERGO_API_URL: http://127.0.0.1:8089
      ROLESERV_NICK: RoleServ
    volumes:
      - certs_irc:/certs:ro
      - ergo_db:/ircd
    depends_on: [certsync]
    labels:
      # WebSocket for web clients: wss://IRC_HOST/webirc
      - traefik.enable=true
      - traefik.http.routers.webirc.rule=Host(`${IRC_HOST}`) && PathPrefix(`/webirc`)
      - traefik.http.routers.webirc.entrypoints=websecure
      - traefik.http.routers.webirc.tls=true
      - traefik.http.services.webirc.loadbalancer.server.port=8097
    healthcheck:
      # Listening on 6697 (checked without connecting, so no log noise).
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':6697 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  # RoleServ: /msg RoleServ HELP. Network roles for any IRC client; changes
  # are made by auth as the caller's account (docs/roles.md). Same image as
  # ergo, connects to its services listener (6680, never published).
  roleserv:
    <<: *restart
    profiles: [irc]
    # Same build as ergo (so `up --build` never pulls an older image for it).
    build: images/ergo
    image: harbor.floret.dev/boson/stack-ergo:2.19.1
    entrypoint: ["/usr/local/bin/boson-ergo"]
    command: ["roleserv"]
    environment:
      ROLESERV_IRC_ADDR: ergo:6680
      ROLESERV_NICK: RoleServ
      ERGO_API_URL: http://ergo:8089
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      AUTH_INTERNAL_URL: http://auth:8081
      AUTH_PUBLIC_URL: http://auth:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      AUTH_ACTING_TOKEN: ${ROLESERV_AUTH_TOKEN:-}
      ROLES_POLL_SECONDS: ${ROLES_POLL_SECONDS:-10}
      IRC_ROLE_BASE_CAPABILITIES: ${IRC_ROLE_BASE_CAPABILITIES:-nofakelag}
    depends_on:
      ergo:
        condition: service_healthy

  # ---- auth -----------------------------------------------------------------
  postgres:
    <<: *restart
    profiles: [auth]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: auth
      # First start only: also create the API's database (api profile).
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      API_DB_USER: ${API_DB_USER:-api}
      API_DB_NAME: ${API_DB_NAME:-api}
      # ... and the directory's (directory profile).
      DIRECTORY_DB_PASSWORD: ${DIRECTORY_DB_PASSWORD:-}
      DIRECTORY_DB_USER: ${DIRECTORY_DB_USER:-directory}
      DIRECTORY_DB_NAME: ${DIRECTORY_DB_NAME:-directory}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth", "-d", "auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *restart
    profiles: [auth]
    # Releases: harbor.floret.dev/boson/auth:<version>. To run an unreleased
    # checkout instead, add compose.auth-src.yaml (see README).
    image: ${AUTH_IMAGE:-harbor.floret.dev/boson/auth:1.7.0}
    environment:
      ENV: production
      LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      SITE_NAME: ${NETWORK_NAME:-Boson}
      PUBLIC_URL: https://${AUTH_HOST}
      ISSUER: https://${AUTH_HOST}
      APP_URL: ${AUTH_APP_URL:-https://${AUTH_HOST}}
      # Extra browser origins allowed to call auth with credentials/tokens and
      # to be SSO return_to targets, e.g. the directory web UI
      # (https://directory.example.com). Comma-separated.
      CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-}
      DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ${AUTH_KEY_ENCRYPTION_KEY:?run scripts/setup.sh}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run scripts/setup.sh}
      # Traefik's X-Forwarded-For is trusted (client IPs for rate limits/audit).
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REGISTRATION: ${REGISTRATION:-open}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      # RoleServ's token for the acting endpoints (/internal/v1/acting/*):
      # changes made on behalf of the IRC user who asked. docs/roles.md.
      INTERNAL_ACTING_TOKEN: ${ROLESERV_AUTH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${AUTH_HOST}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls=true
      # Public listener only. The internal one (8081: /internal/v1, /metrics)
      # is reachable inside the compose network and never routed.
      - traefik.http.services.auth.loadbalancer.server.port=8080

  # ---- voice ----------------------------------------------------------------
  # Makes the voice_data volume writable for quicvoiced (uid 65532), also when
  # it was first created by an image without /data. Exits when done.
  voice-data-init:
    profiles: [voice]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /data && chmod 750 /data"]
    volumes:
      - voice_data:/data
    restart: "no"

  quicvoiced:
    <<: *restart
    profiles: [voice]
    image: ${QUICVOICE_IMAGE:-harbor.floret.dev/boson/quicvoice:1.6.0}
    ports:
      - "7700:7700/udp"
    environment:
      ENV: production
      QUIC_ADDR: ":7700"
      # Internal: /healthz, /version, /metrics. Never routed.
      HTTP_ADDR: ":8080"
      # Public API (GET /v1/rooms, /healthz), routed at https://VOICE_HOST.
      PUBLIC_HTTP_ADDR: ":8090"
      # Static voice channels: comma-separated id:Display Name, in display order.
      VOICE_ROOMS: ${VOICE_ROOMS:-general:General}
      # true = only registry rooms (VOICE_ROOMS + ones created through the
      # API) can be joined; false = any name makes an ad-hoc room.
      VOICE_ROOMS_STRICT: ${VOICE_ROOMS_STRICT:-true}
      # Room registry (dynamic voice channels), in the voice_data volume.
      VOICE_ROOMS_DB: /data/rooms.json
      VOICE_ROOMS_MAX_PER_USER: ${VOICE_ROOMS_MAX_PER_USER:-10}
      VOICE_ROOMS_MAX: ${VOICE_ROOMS_MAX:-500}
      # Who may create voice channels: the auth service's
      # voice_channel_creation setting (admins | founders | registered),
      # cached 30s. VOICE_CHANNEL_CREATION until auth answers.
      AUTH_INTERNAL_URL: http://auth:8081
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      VOICE_CHANNEL_CREATION: ${VOICE_CHANNEL_CREATION:-admins}
      # Founder checks and IRC role locks via Ergo's API (irc profile).
      # Empty ERGO_API_TOKEN = no IRC roles (only admins pass role locks).
      ERGO_API_URL: ${VOICE_ERGO_API_URL:-http://ergo:8089}
      ERGO_API_TOKEN: ${ERGO_API_TOKEN:-}
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE: /certs/tls.key
      # Tokens from the auth service (POST /v1/voice/token), verified via JWKS.
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: quicvoice
      # Optional: HS256 tokens from `quicvoiced token` (legacy / testing).
      JWT_SECRET: ${VOICE_JWT_SECRET:-}
    volumes:
      - certs_voice:/certs:ro
      - voice_data:/data
    depends_on:
      certsync:
        condition: service_started
      voice-data-init:
        condition: service_completed_successfully
    labels:
      # https://VOICE_HOST → the public API listener only (8090). The
      # internal one (8080: /metrics) is reachable inside the compose
      # network and never routed. VOICE_HOST's certificate is already in
      # CERT_HOSTS (quicvoiced uses it for QUIC too).
      - traefik.enable=true
      - traefik.http.routers.voice.rule=Host(`${VOICE_HOST}`)
      - traefik.http.routers.voice.entrypoints=websecure
      - traefik.http.routers.voice.tls=true
      - traefik.http.services.voice.loadbalancer.server.port=8090

  # ---- metrics --------------------------------------------------------------
  victoriametrics:
    <<: *restart
    profiles: [metrics]
    image: victoriametrics/victoria-metrics:v1.131.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-90d}
      - -promscrape.config=/etc/vm/scrape.yml
      - -httpListenAddr=:8428
    volumes:
      - ./monitoring/scrape.yml:/etc/vm/scrape.yml:ro
      - vm_data:/storage
    # Internal only: the admin panel (and Grafana, if you add one) query
    # http://victoriametrics:8428. Not published on the host.

  # ---- admin (SLOT: upcoming admin panel, not released yet) -----------------
  # Off unless COMPOSE_PROFILES includes "admin". Image and env are the
  # planned contract; adjust when the first release ships.
  admin:
    <<: *restart
    profiles: [admin]
    image: ${ADMIN_IMAGE:-harbor.floret.dev/boson/admin:1.6.0}
    environment:
      ENV: production
      PUBLIC_URL: https://${ADMIN_HOST:-admin.${DOMAIN:-localhost}}
      # Seals the admin's auth tokens in the session cookie (32 random bytes, base64).
      SESSION_KEY: ${ADMIN_SESSION_KEY:-}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      AUTH_URL: http://auth:8080
      AUTH_INTERNAL_URL: http://auth:8081
      METRICS_URL: ${ADMIN_METRICS_URL-http://victoriametrics:8428}
      EDGE_NAME: Traefik
      # IRC health (Ergo): set ADMIN_IRC_CHECK= (empty) without the irc profile.
      IRC_CHECK: ${ADMIN_IRC_CHECK-ircs://ergo:6697}
      IRC_CHECK_SERVER_NAME: ${IRC_HOST}
      # Endpoints the admin's BROWSER times ("from you" latency); also its CSP connect-src.
      PUBLIC_PROBE_TARGETS: >-
        ${ADMIN_PUBLIC_PROBES:-auth=https://${AUTH_HOST}/healthz,quicvoiced=https://${VOICE_HOST}/healthz,irc=wss://${IRC_HOST}/webirc,api=https://${API_HOST:-api.localhost}/health}
      GRAFANA_URL: ${GRAFANA_URL:-}
      HEALTH_TARGETS: >-
        auth=http://auth:8081/healthz,auth=http://auth:8081/readyz,quicvoiced=http://quicvoiced:8080/healthz,victoriametrics=http://victoriametrics:8428/health${ADMIN_API_HEALTH-,api=http://api:3000/health}
      VERSION_TARGETS: auth=http://auth:8081/metrics,quicvoiced=http://quicvoiced:8080/version
      # host:port to report, @ where to dial it from inside the network.
      TLS_CHECK_HOSTS: >-
        ${ADMIN_TLS_CHECK_HOSTS:-${VOICE_HOST}:443@traefik:443,${AUTH_HOST}:443@traefik:443,${ADMIN_HOST:-admin.localhost}:443@traefik:443,${IRC_HOST}:6697}
      # Services control (restart/stop/start, logs) through docker-proxy below.
      # Empty ADMIN_DOCKER_PROXY_URL= turns it off.
      DOCKER_PROXY_URL: ${ADMIN_DOCKER_PROXY_URL-http://docker-proxy:2375}
      DOCKER_PROJECT: boson
      DOCKER_PROTECTED_SERVICES: admin,traefik
      # Users' boson profiles (avatar, handle) from the api
      # profile. Set ADMIN_BOSON_API_URL= (empty) without it.
      BOSON_API_URL: ${ADMIN_BOSON_API_URL-http://api:3000}
      # The directory this network is listed in (Directory page; network key
      # + DNS TXT proof). docs/directory.md.
      DIRECTORY_API_URL: ${ADMIN_DIRECTORY_API_URL-https://directory.boson.chat}
      DIRECTORY_REGISTRATION: ${ADMIN_DIRECTORY_REGISTRATION:-true}
      # The stack's own directory (directory profile): the "include the boson
      # main directory" switch, its peers, and users' listings. scripts/setup.sh
      # sets ADMIN_DIRECTORY_LOCAL_URL=http://directory:8080 with the profile.
      DIRECTORY_LOCAL_URL: ${ADMIN_DIRECTORY_LOCAL_URL:-}
      DIRECTORY_INTERNAL_TOKEN: ${DIRECTORY_INTERNAL_TOKEN:-}
    networks: [default, docker-proxy]
    labels:
      - traefik.enable=true
      # Two networks: tell Traefik which one reaches the panel.
      - traefik.docker.network=boson_default
      - traefik.http.routers.admin.rule=Host(`${ADMIN_HOST:-admin.${DOMAIN:-localhost}}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls=true
      - traefik.http.services.admin.loadbalancer.server.port=8080
    # Note: ADMIN_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on: [auth]

  # The admin panel's only door to Docker: a socket proxy that allows listing
  # and inspecting containers, their logs and stats, and start/stop/restart,
  # nothing else (no exec, create, delete, images, volumes, events), and only
  # for the host named "admin". The panel itself never mounts the socket and
  # limits actions to this compose project.
  docker-proxy:
    <<: *restart
    profiles: [admin]
    image: wollomatic/socket-proxy:1.13.2
    # nobody + the host's docker group, so it can open the socket read/write
    # without root. scripts/setup.sh fills DOCKER_GID (getent group docker).
    user: "65534:${DOCKER_GID:-999}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=admin
      - -watchdoginterval=600
      - -stoponwatchdog
      - -shutdowngracetime=5
      - '-allowGET=(/v1\.[0-9]+)?/(_ping|version|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs|stats))'
      - '-allowHEAD=(/v1\.[0-9]+)?/_ping'
      - '-allowPOST=(/v1\.[0-9]+)?/containers/[a-zA-Z0-9_.-]+/(start|stop|restart)'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-proxy]

  # ---- api (optional): the boson backend API --------------------------------
  # Profiles, nick claims and avatars for the boson client
  # (github.com/boson-chat/boson backend/). Uses the stack Postgres and the
  # auth service. POP3_* (nick claims) and R2_* (avatars) are optional: empty
  # disables that feature. See docs/api.md.
  api:
    <<: *restart
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.43.0}
    command: ["serve"]
    environment: &api-env
      PORT: "3000"
      ENV: production
      ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: boson
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${API_DB_NAME:-api}
      DBUSERNAME: ${API_DB_USER:-api}
      DBPASSWORD: ${API_DB_PASSWORD:-}
      DBSSLMODE: disable
      NICK_CLAIM_EMAIL_DOMAIN: ${NICK_CLAIM_EMAIL_DOMAIN:-${DOMAIN:-}}
      NICK_CLAIM_RATE_LIMIT_PER_HOUR: ${NICK_CLAIM_RATE_LIMIT_PER_HOUR:-5}
      PURELYMAIL_POP3_HOST: ${POP3_HOST:-}
      PURELYMAIL_POP3_PORT: ${POP3_PORT:-995}
      PURELYMAIL_POP3_USER: ${POP3_USER:-}
      PURELYMAIL_POP3_TLS: ${POP3_TLS:-true}
      PURELYMAIL_POP3_PASSWORD: ${POP3_PASSWORD:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${R2_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${R2_BUCKET:-}
      CLOUDFLARE_CDN_BASE_URL: ${CDN_BASE_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST:-api.${DOMAIN:-localhost}}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000
    # Note: API_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  # Applies the API's database migrations before it starts (exits when done).
  api-migrate:
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.43.0}
    command: ["migrate", "up"]
    environment: *api-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- directory (optional): a boson network directory -------------------------
  # github.com/boson-chat/directory: the IRC network directory the boson app
  # browses (directory.boson.chat is one). Website + /v1 API at DIRECTORY_HOST,
  # own database in the stack Postgres (needs the auth profile), media in the
  # directory_media volume. Includes directory.boson.chat's listings by default
  # (DIRECTORY_INCLUDE_MAIN), each re-checked against its own DNS. The image
  # applies its migrations at start. See docs/directory.md.
  directory-media-init:
    profiles: [directory]
    image: busybox:1.37.0
    command: ["sh", "-c", "chown 65532:65532 /media && chmod 750 /media"]
    volumes:
      - directory_media:/media
    restart: "no"

  directory:
    <<: *restart
    profiles: [directory]
    image: ${DIRECTORY_IMAGE:-harbor.floret.dev/boson/directory:1.3.0}
    environment:
      ENV: ${DIRECTORY_ENV:-production}
      LOG_LEVEL: ${DIRECTORY_LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${DIRECTORY_DB_USER:-directory}:${DIRECTORY_DB_PASSWORD:-}@postgres:5432/${DIRECTORY_DB_NAME:-directory}?sslmode=disable
      # Owners sign in with this stack's accounts (bearer tokens via JWKS,
      # the browser cookie flow at AUTH_HOST).
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_PUBLIC_URL: https://${AUTH_HOST}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      # /.well-known/boson-directory.json: name, operator, contact. These and
      # the federation values below are defaults only (directory >= 1.4.0):
      # change them in the admin panel's Directory page, which stores them in
      # the directory's database and wins over the env.
      DIRECTORY_NAME: ${DIRECTORY_NAME:-${NETWORK_NAME:-Boson} directory}
      DIRECTORY_PUBLIC_URL: https://${DIRECTORY_HOST:-directory.${DOMAIN:-localhost}}
      DIRECTORY_OPERATOR: ${NETWORK_NAME:-Boson}
      DIRECTORY_CONTACT: ${DIRECTORY_CONTACT:-${ADMIN_EMAIL:-}}
      # Federation: other directories to seed once (comma-separated URLs) and
      # the built-in main peer, on unless DIRECTORY_INCLUDE_MAIN=false. Add or
      # remove peers and switch the main directory at runtime in the admin
      # panel (Directory page) or the directory's own Peers page.
      DIRECTORY_PEERS: ${DIRECTORY_PEERS:-}
      DIRECTORY_MAIN_PEER: ${DIRECTORY_MAIN_PEER:-https://directory.boson.chat}
      DIRECTORY_INCLUDE_MAIN: ${DIRECTORY_INCLUDE_MAIN:-true}
      # Operator API token (X-Internal-Token) for the admin panel.
      DIRECTORY_INTERNAL_TOKEN: ${DIRECTORY_INTERNAL_TOKEN:-}
      # Icons and banners (local volume; S3/R2 optional, see the directory's docs).
      MEDIA_DIR: /media
      # Empty = real DNS (three public resolvers). "fake" = every TXT check
      # passes; only honoured with DIRECTORY_ENV=development (CI).
      DNS_VERIFIER: ${DIRECTORY_DNS_VERIFIER:-}
    volumes:
      - directory_media:/media
    depends_on:
      postgres:
        condition: service_healthy
      directory-media-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.directory.rule=Host(`${DIRECTORY_HOST:-directory.${DOMAIN:-localhost}}`)
      - traefik.http.routers.directory.entrypoints=websecure
      - traefik.http.routers.directory.tls=true
      - traefik.http.services.directory.loadbalancer.server.port=8080
    # Note: DIRECTORY_HOST must be in CERT_HOSTS so Traefik gets its
    # certificate. The legacy https://API_HOST/servers route is in
    # traefik/dynamic/directory.yml (DIRECTORY_SERVES_LEGACY).

  # ---- webroot (optional) ---------------------------------------------------
  # Serves WEBROOT_DIR at http://WEBROOT_HOST/.well-known/acme-challenge/ for
  # a certbot (webroot mode) on this host that manages a cert outside the
  # stack. Don't list WEBROOT_HOST in CERT_HOSTS. See docs/deploy-boson-chat.md.
  webroot:
    <<: *restart
    profiles: [webroot]
    image: busybox:1.37.0
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ${WEBROOT_DIR:-/var/www/certbot}:/srv:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.webroot.rule=Host(`${WEBROOT_HOST:-}`) && PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.webroot.entrypoints=web
      - traefik.http.services.webroot.loadbalancer.server.port=8080

  # ---- wellknown (optional) -------------------------------------------------
  # Serves https://DOMAIN/.well-known/boson.json, which the boson client reads
  # to find this server's IRC, auth and voice endpoints from just the domain.
  # Only for installs where DOMAIN itself points at this server; add DOMAIN to
  # CERT_HOSTS. Generated from .env at every start (images/wellknown/serve.sh).
  wellknown:
    <<: *restart
    profiles: [wellknown]
    image: busybox:1.37.0
    command: ["sh", "/serve.sh"]
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /run:uid=65534,gid=65534,size=1m
    environment:
      # Sections to publish (irc, auth, voice). Default: whichever of those
      # profiles are on. Set it when a part runs elsewhere (e.g. legacy IRC).
      WELLKNOWN_SECTIONS: ${WELLKNOWN_SECTIONS:-${COMPOSE_PROFILES:-}}
      IRC_HOST: ${IRC_HOST}
      AUTH_HOST: ${AUTH_HOST}
      VOICE_HOST: ${VOICE_HOST}
    volumes:
      - ./images/wellknown/serve.sh:/serve.sh:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.wellknown.rule=Host(`${DOMAIN:-localhost}`) && Path(`/.well-known/boson.json`)
      - traefik.http.routers.wellknown.entrypoints=websecure
      - traefik.http.routers.wellknown.tls=true
      - traefik.http.routers.wellknown.middlewares=wellknown-headers
      - traefik.http.middlewares.wellknown-headers.headers.customresponseheaders.Access-Control-Allow-Origin=*
      - traefik.http.middlewares.wellknown-headers.headers.customresponseheaders.Cache-Control=public, max-age=300
      - traefik.http.services.wellknown.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/.well-known/boson.json"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  traefik_acme:
  certs_irc:
  certs_voice:
  ergo_db:
  voice_data:
  pg_data:
  vm_data:
  directory_media:
