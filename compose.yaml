# boson stack: Traefik (TLS + routing), Ergo (IRC), auth + Postgres
# (accounts), quicvoiced (voice), VictoriaMetrics (metrics).
# Configure in .env (see .env.example / scripts/setup.sh), then:
#   docker compose up -d --build
# Which parts run is chosen by COMPOSE_PROFILES in .env
# (irc, voice, auth, metrics, admin, webroot). traefik and certsync always run.
# Install-specific additions: traefik/dynamic/*.yml and compose.override.yaml.
name: boson

x-restart: &restart
  restart: unless-stopped

networks:
  default:
    # Fixed subnet so the auth service (TRUSTED_PROXIES) and Ergo
    # (proxy-allowed-from) can trust X-Forwarded-For from Traefik.
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.203.53.0/24}

services:
  traefik:
    <<: *restart
    image: traefik:v3.7.19
    ports:
      - "80:80"
      - "443:443"
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --log.nocolor=true
      - --ping=true
      - --metrics.prometheus=true
      # Only this compose project's containers, and only those with traefik.enable=true.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`boson`)
      # traefik/dynamic: the stack's cert routers (stack.yml) + your own files.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Everything on :80 redirects to https, except ACME HTTP-01 challenges.
      # allowACMEByPass also lets a more specific router (e.g. the webroot
      # profile) answer challenges for a host whose cert Traefik doesn't manage.
      - --entrypoints.web.allowacmebypass=true
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Drop headers like X_Forwarded_For that alias the ones Traefik sets.
      - --entrypoints.web.http.aliasheadersstrategy=delete
      - --entrypoints.websecure.http.aliasheadersstrategy=delete
      - --certificatesresolvers.le.acme.email=${TLS_ISSUER:?set TLS_ISSUER in .env}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.keytype=${ACME_KEY_TYPE:-EC256}
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    environment:
      # Read by traefik/dynamic/stack.yml.
      CERT_HOSTS: ${CERT_HOSTS:-${IRC_HOST:?set IRC_HOST in .env},${VOICE_HOST:?set VOICE_HOST in .env},${AUTH_HOST:?set AUTH_HOST in .env}}
      TLS_ISSUER: ${TLS_ISSUER}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./local-certs:/local-certs:ro
      - traefik_acme:/acme
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  certsync:
    <<: *restart
    build: images/certsync
    image: harbor.floret.dev/boson/stack-certsync:latest
    environment:
      TLS_ISSUER: ${TLS_ISSUER}
      ACME_JSON: /acme/acme.json
      CERTSYNC_TARGETS: >-
        ${IRC_HOST}:/certs/irc:10000:fullchain.pem:privkey.pem
        ${VOICE_HOST}:/certs/voice:65532:tls.crt:tls.key
    volumes:
      - traefik_acme:/acme:ro
      - ./local-certs:/local-certs:ro
      - certs_irc:/certs/irc
      - certs_voice:/certs/voice
    depends_on: [traefik]

  # ---- irc ------------------------------------------------------------------
  ergo:
    <<: *restart
    profiles: [irc]
    build: images/ergo
    image: harbor.floret.dev/boson/stack-ergo:2.19.1
    ports:
      - "6697:6697"
      - "${IRC_PLAINTEXT_PORT:-127.0.0.1:6667}:6667"
    environment:
      IRC_HOST: ${IRC_HOST}
      DOMAIN: ${DOMAIN:-}
      NETWORK_NAME: ${NETWORK_NAME:-Boson}
      AUTH_HOST: ${AUTH_HOST}
      OPER_NAME: ${OPER_NAME:-admin}
      OPER_PASSWORD_HASH: ${OPER_PASSWORD_HASH:-}
      IRC_PLAINTEXT: ${IRC_PLAINTEXT:-false}
      IRC_WEBSOCKET: ${IRC_WEBSOCKET:-true}
      IRC_WEBSOCKET_ORIGINS: ${IRC_WEBSOCKET_ORIGINS:-}
      IRC_OAUTHBEARER: ${IRC_OAUTHBEARER:-true}
      IRC_PERSISTENT_HISTORY: ${IRC_PERSISTENT_HISTORY:-true}
      STACK_SUBNET: ${STACK_SUBNET:-10.203.53.0/24}
      # auth-script → auth service (internal listener, never published)
      AUTH_VERIFY_URL: http://auth:8081/internal/v1/verify-password
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    volumes:
      - certs_irc:/certs:ro
      - ergo_db:/ircd
    depends_on: [certsync]
    labels:
      # WebSocket for web clients: wss://IRC_HOST/webirc
      - traefik.enable=true
      - traefik.http.routers.webirc.rule=Host(`${IRC_HOST}`) && PathPrefix(`/webirc`)
      - traefik.http.routers.webirc.entrypoints=websecure
      - traefik.http.routers.webirc.tls=true
      - traefik.http.services.webirc.loadbalancer.server.port=8097
    healthcheck:
      # Listening on 6697 (checked without connecting, so no log noise).
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':6697 '"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  # ---- auth -----------------------------------------------------------------
  postgres:
    <<: *restart
    profiles: [auth]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
      POSTGRES_DB: auth
      # First start only: also create the API's database (api profile).
      API_DB_PASSWORD: ${API_DB_PASSWORD:-}
      API_DB_USER: ${API_DB_USER:-api}
      API_DB_NAME: ${API_DB_NAME:-api}
    volumes:
      - pg_data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "auth", "-d", "auth"]
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *restart
    profiles: [auth]
    # Releases: harbor.floret.dev/boson/auth:<version>. To run an unreleased
    # checkout instead, add compose.auth-src.yaml (see README).
    image: ${AUTH_IMAGE:-harbor.floret.dev/boson/auth:1.0.0}
    environment:
      ENV: production
      LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      SITE_NAME: ${NETWORK_NAME:-Boson}
      PUBLIC_URL: https://${AUTH_HOST}
      ISSUER: https://${AUTH_HOST}
      APP_URL: ${AUTH_APP_URL:-https://${AUTH_HOST}}
      DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@postgres:5432/auth?sslmode=disable
      AUTH_KEY_ENCRYPTION_KEY: ${AUTH_KEY_ENCRYPTION_KEY:?run scripts/setup.sh}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?run scripts/setup.sh}
      # Traefik's X-Forwarded-For is trusted (client IPs for rate limits/audit).
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      REGISTRATION: ${REGISTRATION:-open}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.auth.rule=Host(`${AUTH_HOST}`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls=true
      # Public listener only. The internal one (8081: /internal/v1, /metrics)
      # is reachable inside the compose network and never routed.
      - traefik.http.services.auth.loadbalancer.server.port=8080

  # ---- voice ----------------------------------------------------------------
  quicvoiced:
    <<: *restart
    profiles: [voice]
    image: ${QUICVOICE_IMAGE:-harbor.floret.dev/boson/quicvoice:1.3.0}
    ports:
      - "7700:7700/udp"
    environment:
      ENV: production
      QUIC_ADDR: ":7700"
      HTTP_ADDR: ":8080"
      TLS_CERT_FILE: /certs/tls.crt
      TLS_KEY_FILE: /certs/tls.key
      # Tokens from the auth service (POST /v1/voice/token), verified via JWKS.
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: quicvoice
      # Optional: HS256 tokens from `quicvoiced token` (legacy / testing).
      JWT_SECRET: ${VOICE_JWT_SECRET:-}
    volumes:
      - certs_voice:/certs:ro
    depends_on: [certsync]

  # ---- metrics --------------------------------------------------------------
  victoriametrics:
    <<: *restart
    profiles: [metrics]
    image: victoriametrics/victoria-metrics:v1.131.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${METRICS_RETENTION:-90d}
      - -promscrape.config=/etc/vm/scrape.yml
      - -httpListenAddr=:8428
    volumes:
      - ./monitoring/scrape.yml:/etc/vm/scrape.yml:ro
      - vm_data:/storage
    # Internal only: the admin panel (and Grafana, if you add one) query
    # http://victoriametrics:8428. Not published on the host.

  # ---- admin (SLOT: upcoming admin panel, not released yet) -----------------
  # Off unless COMPOSE_PROFILES includes "admin". Image and env are the
  # planned contract; adjust when the first release ships.
  admin:
    <<: *restart
    profiles: [admin]
    image: ${ADMIN_IMAGE:-harbor.floret.dev/boson/admin:1.0.0}
    environment:
      ENV: production
      PUBLIC_URL: https://${ADMIN_HOST:-admin.${DOMAIN:-localhost}}
      # Seals the admin's auth tokens in the session cookie (32 random bytes, base64).
      SESSION_KEY: ${ADMIN_SESSION_KEY:-}
      TRUSTED_PROXIES: ${STACK_SUBNET:-10.203.53.0/24}
      AUTH_URL: http://auth:8080
      AUTH_INTERNAL_URL: http://auth:8081
      METRICS_URL: ${ADMIN_METRICS_URL-http://victoriametrics:8428}
      GRAFANA_URL: ${GRAFANA_URL:-}
      HEALTH_TARGETS: >-
        auth=http://auth:8081/healthz,auth=http://auth:8081/readyz,quicvoiced=http://quicvoiced:8080/healthz,victoriametrics=http://victoriametrics:8428/health${ADMIN_API_HEALTH-,api=http://api:3000/health}
      VERSION_TARGETS: auth=http://auth:8081/metrics,quicvoiced=http://quicvoiced:8080/version
      # host:port to report, @ where to dial it from inside the network.
      TLS_CHECK_HOSTS: >-
        ${ADMIN_TLS_CHECK_HOSTS:-${VOICE_HOST}:443@traefik:443,${AUTH_HOST}:443@traefik:443,${ADMIN_HOST:-admin.localhost}:443@traefik:443,${IRC_HOST}:6697}
    labels:
      - traefik.enable=true
      - traefik.http.routers.admin.rule=Host(`${ADMIN_HOST:-admin.${DOMAIN:-localhost}}`)
      - traefik.http.routers.admin.entrypoints=websecure
      - traefik.http.routers.admin.tls=true
      - traefik.http.services.admin.loadbalancer.server.port=8080
    # Note: ADMIN_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on: [auth]

  # ---- api (optional): the boson backend API --------------------------------
  # Server directory, profiles, nick claims and avatars for the boson client
  # (github.com/boson-chat/boson backend/). Uses the stack Postgres and the
  # auth service. POP3_* (nick claims) and R2_* (avatars) are optional: empty
  # disables that feature. See docs/api.md.
  api:
    <<: *restart
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.43.0}
    command: ["serve"]
    environment: &api-env
      PORT: "3000"
      ENV: production
      ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      AUTH_ISSUER: https://${AUTH_HOST}
      AUTH_AUDIENCE: boson
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${API_DB_NAME:-api}
      DBUSERNAME: ${API_DB_USER:-api}
      DBPASSWORD: ${API_DB_PASSWORD:-}
      DBSSLMODE: disable
      NICK_CLAIM_EMAIL_DOMAIN: ${NICK_CLAIM_EMAIL_DOMAIN:-${DOMAIN:-}}
      NICK_CLAIM_RATE_LIMIT_PER_HOUR: ${NICK_CLAIM_RATE_LIMIT_PER_HOUR:-5}
      PURELYMAIL_POP3_HOST: ${POP3_HOST:-}
      PURELYMAIL_POP3_PORT: ${POP3_PORT:-995}
      PURELYMAIL_POP3_USER: ${POP3_USER:-}
      PURELYMAIL_POP3_TLS: ${POP3_TLS:-true}
      PURELYMAIL_POP3_PASSWORD: ${POP3_PASSWORD:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${R2_SECRET_KEY:-}
      CLOUDFLARE_R2_ENDPOINT: ${R2_ENDPOINT:-}
      CLOUDFLARE_R2_BUCKET: ${R2_BUCKET:-}
      CLOUDFLARE_CDN_BASE_URL: ${CDN_BASE_URL:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${API_HOST:-api.${DOMAIN:-localhost}}`)
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls=true
      - traefik.http.services.api.loadbalancer.server.port=3000
    # Note: API_HOST must be in CERT_HOSTS so Traefik gets its certificate.
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully

  # Applies the API's database migrations before it starts (exits when done).
  api-migrate:
    profiles: [api]
    image: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.43.0}
    command: ["migrate", "up"]
    environment: *api-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Scheduled jobs (DNS re-verification daily, server health every 15 min).
  api-cron:
    <<: *restart
    profiles: [api]
    build:
      context: images/api-cron
      args:
        API_IMAGE: ${API_IMAGE:-harbor.floret.dev/boson/backend:0.43.0}
    image: harbor.floret.dev/boson/stack-api-cron:${API_CRON_TAG:-0.43.0}
    environment: *api-env
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  # ---- webroot (optional) ---------------------------------------------------
  # Serves WEBROOT_DIR at http://WEBROOT_HOST/.well-known/acme-challenge/ for
  # a certbot (webroot mode) on this host that manages a cert outside the
  # stack. Don't list WEBROOT_HOST in CERT_HOSTS. See docs/deploy-boson-chat.md.
  webroot:
    <<: *restart
    profiles: [webroot]
    image: busybox:1.37.0
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/srv"]
    user: "65534:65534"
    read_only: true
    volumes:
      - ${WEBROOT_DIR:-/var/www/certbot}:/srv:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.webroot.rule=Host(`${WEBROOT_HOST:-}`) && PathPrefix(`/.well-known/acme-challenge/`)
      - traefik.http.routers.webroot.entrypoints=web
      - traefik.http.services.webroot.loadbalancer.server.port=8080

volumes:
  traefik_acme:
  certs_irc:
  certs_voice:
  ergo_db:
  pg_data:
  vm_data:
